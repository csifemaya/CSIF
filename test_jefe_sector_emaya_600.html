const Q=[{"id":1,"b":"Código ético y de conducta","q":"¿Cuántos años de historia menciona EMAYA en la introducción de su Código ético?","o":["Más de 100","Más de 25","Más de 50","Más de 75"],"a":3,"r":"Introducción"},{"id":2,"b":"Código ético y de conducta","q":"¿Cuál es la finalidad del Código ético y de conducta de EMAYA?","o":["Desarrollar pautas de comportamiento profesional, ético y socialmente responsable, prevenir conductas ilícitas y establecer mecanismos de seguimiento y control","Fijar las condiciones retributivas de la plantilla","Regular únicamente la relación con la clientela","Establecer exclusivamente el régimen sancionador del personal"],"a":0,"r":"Introducción"},{"id":3,"b":"Código ético y de conducta","q":"¿A quién va dirigido el Código ético?","o":["A todas las personas que integran EMAYA (plantilla, Dirección y Consejo de Administración) y a quienes trabajan o colaboran con ella","Solo a la plantilla con contrato fijo","Solo a la Dirección y al Consejo de Administración","Únicamente a las empresas proveedoras"],"a":0,"r":"Introducción: ¿A quién va dirigido?"},{"id":4,"b":"Código ético y de conducta","q":"¿Cuál de las siguientes actividades NO figura entre las áreas de actividad de la misión de EMAYA?","o":["Generación de energía renovable y comercialización de electricidad y gas","Limpieza viaria y recogida selectiva de residuos","Gestión del transporte público urbano","Abastecimiento de agua potable, saneamiento y depuración de aguas residuales"],"a":2,"r":"Misión"},{"id":5,"b":"Código ético y de conducta","q":"Según su visión, ¿qué quiere ser EMAYA?","o":["Una empresa líder en rentabilidad económica","Una empresa referente exclusivamente en gestión del agua","La mayor empresa de servicios de las Illes Balears","Una empresa pública de referencia en calidad del servicio, innovación y sostenibilidad"],"a":3,"r":"Visión"},{"id":6,"b":"Código ético y de conducta","q":"¿Cuál de los siguientes NO es uno de los valores de EMAYA?","o":["Integridad","Servicio","Rentabilidad","Sostenibilidad"],"a":2,"r":"Valores"},{"id":7,"b":"Código ético y de conducta","q":"En el Código ético, el valor «Integridad» se refiere a:","o":["La relación con el Comité de empresa","El trato con las empresas competidoras","La gestión de los recursos públicos","La seguridad de las instalaciones"],"a":2,"r":"Valores"},{"id":8,"b":"Código ético y de conducta","q":"En el Código ético, el valor «Personas» expresa preocupación por:","o":["La plantilla (principal activo) y las personas usuarias","Las empresas proveedoras y contratistas","Solo las personas usuarias","Solo la plantilla"],"a":0,"r":"Valores"},{"id":9,"b":"Código ético y de conducta","q":"¿Qué engloba el valor «Sostenibilidad» según el Código?","o":["Reducción de costes y optimización de tarifas","Economía circular, protección medioambiental, energía renovable y movilidad sostenible","Digitalización de los trámites con la clientela","Formación continua de la plantilla"],"a":1,"r":"Valores"},{"id":10,"b":"Código ético y de conducta","q":"¿Qué recoge el valor «Servicio»?","o":["Prioridad al servicio de agua sobre el resto","Cumplimiento estricto del horario laboral","Vocación de servicio a los usuarios y usuarias, con interacción amigable y digital","Atención presencial exclusiva"],"a":2,"r":"Valores"},{"id":11,"b":"Código ético y de conducta","q":"Según la misión, en todas sus operaciones EMAYA pone el foco en:","o":["La comercialización de energía exclusivamente","La satisfacción de los usuarios y usuarias y el cuidado del medioambiente, primando la seguridad de las personas y las instalaciones","La reducción de plantilla y la rentabilidad","La expansión a otros municipios"],"a":1,"r":"Misión"},{"id":12,"b":"Código ético y de conducta","q":"¿Qué estándar de calidad exige EMAYA a todas las personas, según el apartado «Compromiso»?","o":["Un estándar flexible según el puesto","Un estándar mínimo exigido por ley","Un estándar de calidad especialmente elevado","Un estándar acordado en convenio"],"a":2,"r":"La persona: Compromiso"},{"id":13,"b":"Código ético y de conducta","q":"Las actuaciones de EMAYA y de las personas que se relacionan con ella deben estar presididas por los principios de:","o":["Lealtad y buena fe","Confidencialidad y reserva","Competitividad y rentabilidad","Jerarquía y disciplina"],"a":0,"r":"La persona: Compromiso"},{"id":14,"b":"Código ético y de conducta","q":"En el apartado «Entorno de trabajo», EMAYA se esfuerza por crear entornos donde impere:","o":["La productividad por encima de todo","La jerarquía estricta","La competitividad entre equipos","La confianza, el respeto a la dignidad de las personas, la cordialidad y el trabajo en equipo"],"a":3,"r":"La persona: Entorno de trabajo"},{"id":15,"b":"Código ético y de conducta","q":"¿De quién es la responsabilidad de generar y mantener un ambiente de trabajo agradable, gratificante y seguro?","o":["Del Comité de Ética","Solo del servicio de prevención","Solo de la Dirección","De todos y todas"],"a":3,"r":"La persona: Entorno de trabajo"},{"id":16,"b":"Código ético y de conducta","q":"¿Qué garantiza EMAYA en materia de oportunidades?","o":["La absoluta igualdad de oportunidades","La promoción automática por antigüedad","La igualdad solo en el acceso al empleo","La igualdad solo para personal fijo"],"a":0,"r":"La persona: Diversidad e igualdad"},{"id":17,"b":"Código ético y de conducta","q":"Respecto a la formación, el personal de EMAYA se compromete a:","o":["Participar en los programas de formación en la medida que sea requerido y esforzarse por obtener el máximo aprovechamiento","Costear su propia formación","Realizar formación solo en horario no laboral","Participar únicamente en formación voluntaria"],"a":0,"r":"La persona: Diversidad e igualdad"},{"id":18,"b":"Código ético y de conducta","q":"EMAYA respeta los derechos de:","o":["Huelga exclusivamente","Negociación individual de condiciones","Sindicación solo para personal fijo","Sindicación, asociación y negociación colectiva"],"a":3,"r":"La persona: Derechos laborales"},{"id":19,"b":"Código ético y de conducta","q":"¿Qué objetivos persigue la relación con las organizaciones representativas de los trabajadores y trabajadoras?","o":["Reducción de costes salariales","Aumento de la productividad","Paz social y estabilidad laboral","Reducción del absentismo"],"a":2,"r":"La persona: Derechos laborales"},{"id":20,"b":"Código ético y de conducta","q":"Las directrices de seguridad marcadas por la organización deben ser adoptadas por cada empleado y empleada:","o":["Solo en trabajos de riesgo alto","Sin ningún tipo de reserva","Con las reservas que cada persona estime","Previa consulta con el comité"],"a":1,"r":"La persona: Derechos laborales"},{"id":21,"b":"Código ético y de conducta","q":"¿Qué obligación establece EMAYA en materia de confidencialidad?","o":["Publicar toda la información interna","Informar a la clientela de todos los datos de la empresa","Mantener la debida confidencialidad en el tratamiento de datos o informaciones no públicas de EMAYA o de terceros","Compartir datos con otras administraciones sin límite"],"a":2,"r":"La persona: Confidencialidad"},{"id":22,"b":"Código ético y de conducta","q":"Los datos de carácter personal se tratan en EMAYA de forma:","o":["Especialmente restrictiva, obteniendo únicamente los necesarios","Abierta y compartida entre departamentos","Libre mientras no se publiquen","Solo restrictiva para el personal laboral"],"a":0,"r":"La persona: Confidencialidad"},{"id":23,"b":"Código ético y de conducta","q":"Respecto a los recursos de EMAYA, ¿qué se exige?","o":["Un uso responsable para que se lleven a cabo correctamente las funciones propias de cada persona","Uso libre para fines personales","Uso limitado a horario laboral y sin excepciones","Uso exclusivo de la Dirección"],"a":0,"r":"La persona: Los recursos de EMAYA"},{"id":24,"b":"Código ético y de conducta","q":"¿Quién es responsable de la utilización correcta y la protección de los activos y recursos facilitados por la empresa?","o":["Cada miembro de EMAYA","Solo el departamento de compras","El servicio de prevención","Solo la Dirección"],"a":0,"r":"La persona: Los recursos de EMAYA"},{"id":25,"b":"Código ético y de conducta","q":"¿Qué derechos de terceras personas deben garantizarse en el uso de los recursos?","o":["Solo los datos personales de la clientela","Los derechos y libertades respecto de los datos personales y la propiedad intelectual o industrial","Solo la propiedad industrial","Los derechos de autor del personal"],"a":1,"r":"La persona: Los recursos de EMAYA"},{"id":26,"b":"Código ético y de conducta","q":"¿Cómo debe mantenerse el diálogo con la clientela?","o":["A través de las asociaciones de vecinos","De forma permanente y constructiva, mediante canales de comunicación bidireccionales","Solo mediante atención presencial","Únicamente por escrito"],"a":1,"r":"Relación con la clientela"},{"id":27,"b":"Código ético y de conducta","q":"¿En qué norma deben inspirarse los valores fundamentales que regulan la contratación con empresas proveedoras y contratistas?","o":["En el Código Civil","En el convenio colectivo","En la ordenanza municipal de limpieza","En la norma de contratos del sector público"],"a":3,"r":"Relación con empresas proveedoras"},{"id":28,"b":"Código ético y de conducta","q":"¿Qué valores fundamentales deben estar presentes en la relación con proveedores y contratistas?","o":["La exclusividad y la fidelidad","La confianza y la transparencia","La rapidez y el menor precio","La confidencialidad y la discreción"],"a":1,"r":"Relación con empresas proveedoras"},{"id":29,"b":"Código ético y de conducta","q":"¿Qué política de compra considera vital EMAYA?","o":["Una política de compra sostenible que incentive la contratación de proveedores con políticas de gestión ética y social","Contratar siempre al proveedor más barato","Contratar siempre a los mismos proveedores","Contratar solo a proveedores de Palma"],"a":0,"r":"Relación con empresas proveedoras"},{"id":30,"b":"Código ético y de conducta","q":"Respecto al medio ambiente, las decisiones corporativas en EMAYA deben garantizar:","o":["Un enfoque preventivo del impacto de las operaciones","Un enfoque reactivo ante incidentes","El cumplimiento mínimo de la normativa","La reducción de inversiones ambientales"],"a":0,"r":"El entorno: El medio ambiente"},{"id":31,"b":"Código ético y de conducta","q":"EMAYA garantiza el mismo estándar de exigencia con empresas proveedoras, contratistas y colaboradoras y exige:","o":["Certificaciones ISO en todos los casos","El cumplimiento de los procedimientos y requisitos ambientales aplicables en cada caso","Precios competitivos","La contratación de personal local"],"a":1,"r":"El entorno: El medio ambiente"},{"id":32,"b":"Código ético y de conducta","q":"¿Qué son pilares básicos de la actuación de EMAYA en materia de patrimonio?","o":["Preservar y respetar la ciudad y el patrimonio histórico, cultural y arqueológico, generando el mínimo impacto urbanístico","Financiar actividades culturales","Restaurar edificios históricos","Promocionar el turismo cultural"],"a":0,"r":"El entorno: El patrimonio"},{"id":33,"b":"Código ético y de conducta","q":"En materia de urbanismo y construcción, EMAYA garantiza el cumplimiento de la normativa:","o":["Solo estatal","Solo autonómica","Solo local","Nacional, autonómica y local"],"a":3,"r":"El entorno: El patrimonio"},{"id":34,"b":"Código ético y de conducta","q":"¿Qué criterio adopta EMAYA frente al soborno y la corrupción?","o":["Evaluación caso por caso","Tolerancia limitada a importes pequeños","Tolerancia cero","Tolerancia solo con entidades privadas"],"a":2,"r":"Nosotros: Corrupción y soborno"},{"id":35,"b":"Código ético y de conducta","q":"Cualquier persona expuesta a situaciones de corrupción o soborno debe:","o":["Comunicarlo solo a las autoridades judiciales","Esperar a tener pruebas concluyentes","Conocer la normativa aplicable y comunicar a la empresa lo más rápido posible cualquier hecho o indicio","Resolverlo con la persona implicada"],"a":2,"r":"Nosotros: Corrupción y soborno"},{"id":36,"b":"Código ético y de conducta","q":"En materia de corrupción, EMAYA:","o":["Solo colabora si hay requerimiento judicial","Colabora de forma activa con las autoridades administrativas y judiciales para investigar y depurar responsabilidades","Gestiona los casos internamente sin informar a terceros","Delega la investigación en el Comité de empresa"],"a":1,"r":"Nosotros: Corrupción y soborno"},{"id":37,"b":"Código ético y de conducta","q":"¿Qué conflictos de interés debe evitar el personal?","o":["Cualquier escenario de conflicto, directo o indirecto, entre sus intereses personales y/o laborales y los de la empresa","Solo los que afecten a la contratación","Solo los de carácter económico","Solo los conflictos directos"],"a":0,"r":"Nosotros: Conflictos de interés"},{"id":38,"b":"Código ético y de conducta","q":"Respecto a la transparencia, EMAYA:","o":["Restringe el acceso a la información económica","Cumple las previsiones legales para facilitar el acceso corporativo a la ciudadanía mediante herramientas tecnológicas","Publica solo la información financiera","Publica solo la información que la ciudadanía solicita"],"a":1,"r":"Nosotros: Transparencia"},{"id":39,"b":"Código ético y de conducta","q":"¿Qué principios garantiza EMAYA en los procedimientos de contratación?","o":["Confidencialidad de las ofertas y adjudicación al precio más bajo","Prioridad a proveedores locales y adjudicación directa","Exclusividad y fidelización de proveedores","Libertad de acceso a las licitaciones, publicidad, concurrencia, idoneidad, transparencia, no discriminación, igualdad de trato y justificación de la oferta más ventajosa"],"a":3,"r":"Nosotros: Contratación pública"},{"id":40,"b":"Código ético y de conducta","q":"El personal involucrado en la selección de empresas proveedoras debe abstenerse de participar cuando:","o":["El importe del contrato supere un umbral","L cativa de residuos van a:","o":["Vidrio","Envases ligeros","Resto","Papel y cartón"],"a":2,"r":"Anexo II"},{"id":176,"b":"Protocolo de acoso","q":"¿Cuál es el objeto principal del Protocolo de prevención ante el acoso psicológico, sexual o por razón de sexo?","o":["Regular la mediación en conflictos económicos","Establecer los turnos de trabajo","Establecer políticas que contribuyan a entornos laborales libres de acoso y garantizar procedimientos adecuados para tratar y corregir el problema","Fijar el régimen disciplinario de la plantilla"],"a":2,"r":"1. Objeto"},{"id":177,"b":"Protocolo de acoso","q":"¿A quién se aplica el protocolo?","o":["Solo al personal de Calidad Urbana","Solo al personal fijo","A toda la plantilla, independientemente de su situación contractual y categoría profesional","Solo a los mandos intermedios"],"a":2,"r":"2. Ámbito de aplicación"},{"id":178,"b":"Protocolo de acoso","q":"¿Cómo se dará a conocer el protocolo al personal?","o":["Mediante su divulgación e información, así como formación en prevención de riesgos psicosociales y del acoso","Solo en el tablón de anuncios","Solo mediante correo electrónico","Solo en la entrevista de acogida"],"a":0,"r":"2. Ámbito de aplicación"},{"id":179,"b":"Protocolo de acoso","q":"La expresión «acoso» alcanza toda conducta que, con cierta reiteración y sistematicidad, pueda considerarse:","o":["Disciplinaria","Exclusivamente física","Ofensiva, humillante, violenta o intimidatoria, en el lugar de trabajo o con ocasión de éste","Informal"],"a":2,"r":"3. Objetivo y conceptos básicos"},{"id":180,"b":"Protocolo de acoso","q":"El acoso psicológico es la exposición a conductas de violencia psicológica dirigidas de forma reiterada y prolongada hacia una o más personas por parte de otra u otras que actúan desde:","o":["Una posición de igualdad","Una posición de poder (no necesariamente jerárquica)","Cualquier posición con un mínimo de tres personas","Una posición jerárquica superior"],"a":1,"r":"3.1.1 Acoso psicológico"},{"id":181,"b":"Protocolo de acoso","q":"¿Qué dos circunstancias deben darse para hablar de acoso psicológico o laboral?","o":["Que se produzca fuera del trabajo y sea intencionado","Que sea de forma sistemática (p. ej. una vez por semana) y que se prolongue en el tiempo (más de seis meses)","Que sea puntual y grave","Que haya testigos y denuncia previa"],"a":1,"r":"3.1.1 Acoso psicológico"},{"id":182,"b":"Protocolo de acoso","q":"¿Qué intencionalidad suele perseguirse en el acoso psicológico?","o":["Que la persona abandone su puesto de trabajo","Aumentar la productividad","Reorganizar equipos","Mejorar el rendimiento"],"a":0,"r":"3.1.1 Acoso psicológico"},{"id":183,"b":"Protocolo de acoso","q":"El «terror telefónico» llevado a cabo por la persona hostigadora es un ejemplo de:","o":["Ataque con medidas organizacionales","Ataque a las actitudes de la víctima","Ataque a la vida privada de la víctima","Violencia física"],"a":2,"r":"3.1.1 Acoso psicológico"},{"id":184,"b":"Protocolo de acoso","q":"Amenazas de violencia física, uso de violencia menor, gritos o insultos son ejemplos de:","o":["Ataques a la vida privada","Ataques con medidas organizacionales","Rumores","Violencia física o agresiones verbales"],"a":3,"r":"3.1.1 Acoso psicológico"},{"id":185,"b":"Protocolo de acoso","q":"Los ataques a las creencias políticas o religiosas y las mofas a la nacionalidad son ejemplos de:","o":["Medidas organizacionales","Ataques a la vida privada","Ataques a las actitudes de la víctima","Violencia física"],"a":2,"r":"3.1.1 Acoso psicológico"},{"id":186,"b":"Protocolo de acoso","q":"Hablar mal de la persona a su espalda y difundir rumores falsos sobre su trabajo o vida privada son ejemplos de:","o":["Ataques a las actitudes","Rumores","Violencia física","Ataques con medidas organizacionales"],"a":1,"r":"3.1.1 Acoso psicológico"},{"id":187,"b":"Protocolo de acoso","q":"¿A qué norma técnica se remite el protocolo para definir qué NO es acoso?","o":["NTP 700","NTP 891","NTP 854 «Acoso psicológico en el trabajo: definición» del INSHT","NTP 892"],"a":2,"r":"3.1.1 Qué NO es acoso"},{"id":188,"b":"Protocolo de acoso","q":"¿Cuál de estas situaciones NO es mobbing según el protocolo?","o":["Reprender reiteradamente a una persona delante de otras","Atacar sistemáticamente a una persona","Las críticas constructivas, explícitas y justificadas","Destruir la reputación de una persona mediante calumnias"],"a":2,"r":"3.1.1 Qué NO es acoso"},{"id":189,"b":"Protocolo de acoso","q":"El estilo de mando autoritario por parte de los superiores:","o":["Es acoso si el mando es hombre","No constituye por sí mismo acoso, pero debe tratarse en el marco de la prevención de riesgos psicosociales","Es siempre acoso","Es siempre una falta muy grave"],"a":1,"r":"3.1.1 Qué NO es acoso"},{"id":190,"b":"Protocolo de acoso","q":"El comportamiento arbitrario o excesivamente autoritario realizado a la colectividad en general:","o":["Es acoso sexual","No constituye acoso psicológico","Es acoso por razón de sexo","Es acoso psicológico"],"a":1,"r":"3.1.1 Qué NO es acoso"},{"id":191,"b":"Protocolo de acoso","q":"El acoso sexual se define como:","o":["Cualquier comportamiento verbal o físico, de naturaleza sexual, que tenga el propósito o produzca el efecto de atentar contra la dignidad de una persona, en particular cuando se crea un entorno intimidatorio, degradante u ofensivo","Cualquier comportamiento físico en el trabajo","Cualquier comentario sobre la apariencia","Solo el contacto físico no deseado"],"a":0,"r":"3.1.2 Acoso sexual"},{"id":192,"b":"Protocolo de acoso","q":"Las insinuaciones sexuales molestas, proposiciones o presión para la actividad sexual son:","o":["Conducta verbal de naturaleza sexual","Acoso psicológico","Conducta física de naturaleza sexual","Conducta no verbal de naturaleza sexual"],"a":0,"r":"3.1.2 Acoso sexual"},{"id":193,"b":"Protocolo de acoso","q":"La exhibición de fotos sexualmente sugestivas o pornográficas, miradas o gestos lascivos y silbidos son:","o":["Conducta no verbal de naturaleza sexual","Conducta física de naturaleza sexual","Conducta verbal de naturaleza sexual","Acoso psicológico"],"a":0,"r":"3.1.2 Acoso sexual"},{"id":194,"b":"Protocolo de acoso","q":"Para considerar una conducta como acoso sexual, siempre estamos ante una conducta:","o":["Con testigos","De naturaleza claramente sexual, no deseada por la víctima, sin reciprocidad e impuesta","Reiterada durante seis meses","Realizada por un superior"],"a":1,"r":"3.1.2 Acoso sexual"},{"id":195,"b":"Protocolo de acoso","q":"El acoso por razón de sexo es cualquier comportamiento realizado en función del sexo u orientación sexual de una persona con el propósito o efecto de:","o":["Mejorar el rendimiento","Reasignar su puesto","Atentar contra su dignidad y crear un entorno intimidatorio, degradante u ofensivo","Discriminar en el acceso al empleo"],"a":2,"r":"3.1.3 Acoso por razón de sexo"},{"id":196,"b":"Protocolo de acoso","q":"¿Cuál es una conducta calificada de acoso por razón de sexo?","o":["Asignar tareas sin sentido o imposibles de lograr (plazos irracionales) a una persona en función de su sexo","Dar un trato cordial","Aplicar el mismo criterio de asignación de tareas a todas las personas","Realizar evaluaciones de desempeño"],"a":0,"r":"3.1.3 Acoso por razón de sexo"},{"id":197,"b":"Protocolo de acoso","q":"Según el anexo, el acoso por razón de sexo en el trabajo debe producirse en el ámbito de la organización o como consecuencia de una relación de trabajo, tener su fundamento en la constatación del sexo de la persona perjudicada y:","o":["Durar al menos seis meses","Haber sido denunciado previamente","Revestir suficiente gravedad en función de su intensidad, reiteración o efectos sobre la salud","Haber sido cometido por un superior"],"a":2,"r":"Anexo: Acoso por razón de sexo"},{"id":198,"b":"Protocolo de acoso","q":"Las situaciones de violencia laboral se caracterizan por ser:","o":["Procesos graduales que van gestándose a lo largo del tiempo, por lo que se debe actuar de forma preventiva","Hechos puntuales e imprevisibles","Siempre físicos","Siempre intencionados"],"a":0,"r":"4. Medidas preventivas"},{"id":199,"b":"Protocolo de acoso","q":"¿Cuál de las siguientes es una medida preventiva del acoso?","o":["Sanción preventiva","Reducción de plantilla","Formación en prevención del acoso a todo el personal y en habilidades directivas a mandos intermedios","Rotación obligatoria de puestos"],"a":2,"r":"4. Medidas preventivas"},{"id":200,"b":"Protocolo de acoso","q":"La información como medida preventiva consiste en:","o":["Informar solo a los mandos","Informar solo a la persona afectada","Divulgar material (carteles, folletos, web) con la información necesaria y suficiente para la prevención del acoso","Publicar los casos resueltos"],"a":2,"r":"4. Medidas preventivas"},{"id":201,"b":"Protocolo de acoso","q":"¿Qué es el PAE?","o":["El Plan de Acción Estratégico","El Programa de Atención al Empleado, para atender a cualquier persona trabajadora que perciba malestar de origen laboral, conflicto o cualquier aspecto que le afecte en el ámbito laboral","El Protocolo de Actuación Específico","El Procedimiento de Actuación Externo"],"a":1,"r":"4. Medidas preventivas"},{"id":202,"b":"Protocolo de acoso","q":"Las investigaciones de casos puntuales se realizan:","o":["Para aquellas personas que lo soliciten, investigando causas y posibles soluciones","Solo por la comisión","De oficio en todos los casos","Solo si hay denuncia formal"],"a":0,"r":"4. Medidas preventivas"},{"id":203,"b":"Protocolo de acoso","q":"Los procedimientos de solución autónoma de conflictos de violencia laboral se basan en las notas técnicas de prevención:","o":["891 y 854","891 y 892","854 y 855","700 y 701"],"a":1,"r":"4. Medidas preventivas"},{"id":204,"b":"Protocolo de acoso","q":"¿Con qué servicio solicita cita la persona trabajadora que percibe acoso en la fase previa mediante PAE?","o":["Con RRHH","Con el Servicio de Inspección","Con el comité de empresa","Con el servicio de psicosociología"],"a":3,"r":"4. Fase previa mediante PAE"},{"id":205,"b":"Protocolo de acoso","q":"En la fase previa mediante PAE, si hay acuerdo y conciliación entre ambas partes se elabora:","o":["Un informe de resultados y acuerdos alcanzados y se hace seguimiento","Una sanción","Una denuncia formal","Un archivo definitivo"],"a":0,"r":"4. Fase previa mediante PAE"},{"id":206,"b":"Protocolo de acoso","q":"¿Dónde está ubicado el servicio de psicosociología?","o":["En la calle Joan Maragall","En Son Reus","En Son Castelló","En Son Pacs"],"a":3,"r":"5. Declaración de principios"},{"id":207,"b":"Protocolo de acoso","q":"¿Quién es la persona designada en EMAYA para la gestión de los casos de acoso?","o":["El/la gerente","El/la delegado/a sindical","El/la jefe/a de RRHH","El/la psicólogo/a del servicio de prevención"],"a":3,"r":"6. Proceso o protocolo de actuación"},{"id":208,"b":"Protocolo de acoso","q":"¿Cómo será difundido el protocolo al personal?","o":["Solo por correo postal","Mediante la web de EMAYA, los delegados de prevención o adjunto a la nómina","Solo en la intranet","Solo mediante carteles"],"a":1,"r":"6. Proceso o protocolo de actuación"},{"id":209,"b":"Protocolo de acoso","q":"La vía informal de actuación sirve para resolver el caso:","o":["Normalmente mediante diálogo y/o mediación, y se incluye en el PAE; no son casos de acoso pero sí conflictos que deben tratarse","Con intervención de la comisión anti acoso","Con sanción disciplinaria","Mediante una investigación formal"],"a":0,"r":"6. Proceso o protocolo de actuación"},{"id":210,"b":"Protocolo de acoso","q":"La vía formal u oficial exige:","o":["La intervención e implicación de más personas, áreas o departamentos en el proceso de actuación","La mediación voluntaria","Solo un diálogo entre las partes","Solo la intervención del servicio de psicosociología"],"a":0,"r":"6. Proceso o protocolo de actuación"},{"id":211,"b":"Protocolo de acoso","q":"Durante todo el proceso, la persona que denuncie podrá estar:","o":["Acompañada de una persona de su confianza","Representada por un abogado obligatoriamente","Acompañada por la persona denunciada","Sola"],"a":0,"r":"6.b Fases"},{"id":212,"b":"Protocolo de acoso","q":"¿Quién puede denunciar casos de presunto acoso además de la persona afectada?","o":["Cualquier persona externa","Solo RRHH","La representación legal de las personas trabajadoras, las personas delegadas de prevención y cualquier persona trabajadora que tenga conocimiento de los hechos","Solo la representación legal"],"a":2,"r":"6.1 Fase de iniciación"},{"id":213,"b":"Protocolo de acoso","q":"¿Qué sucede si el servicio de psicosociología tiene conocimiento de un posible caso de acoso?","o":["Lo comunicará a la plantilla","Lo archivará","Contactará con la persona supuestamente acosada para informarla sobre el protocolo","Iniciará la sanción"],"a":2,"r":"6.1 Fase de iniciación"},{"id":214,"b":"Protocolo de acoso","q":"El escrito de denuncia debe contener, al menos:","o":["Solo la firma de la persona","Solo descripción de los hechos","Solo nombre y apellidos","Identificación y firma de la persona denunciante, descripción de los hechos y naturaleza del acoso, personas presuntamente acosadoras, información para la investigación, testigos, y si se gestiona mediante la comisión o no"],"a":3,"r":"6.1 Fase de iniciación"},{"id":215,"b":"Protocolo de acoso","q":"Una vez la denuncia está en poder de la persona mediadora, esta mantendrá una entrevista con la presunta víctima en un plazo máximo de:","o":["15 días laborales","10 días naturales","7 días laborables siguientes a su recepción","3 días laborables"],"a":2,"r":"6.1 Fase de iniciación"},{"id":216,"b":"Protocolo de acoso","q":"En la entrevista, la persona mediadora solicitará a la persona denunciante:","o":["Que firme un acuerdo de confidencialidad con la persona denunciada","Que renuncie a acciones legales","El consentimiento expreso y por escrito para poder acceder a cuanta información sea precisa","Que abone una tasa"],"a":2,"r":"6.1 Fase de iniciación"},{"id":217,"b":"Protocolo de acoso","q":"Cuando el procedimiento se tramita ante la comisión de prevención del acoso, se puede optar por omitir los nombres de víctima, presuntas personas acosadoras y testigos, sustituyéndolos por:","o":["Pseudónimos","Números de matrícula","Códigos alfanuméricos","Iniciales"],"a":2,"r":"6.1 Fase de iniciación"},{"id":218,"b":"Protocolo de acoso","q":"En la fase de desarrollo, la persona mediadora/instructora podrá realizar:","o":["Solo la revisión de documentación","Entrevistas con las demás personas trabajadoras, la representación legal, las personas superiores jerárquicas y la presunta persona acosadora, y recabar antecedentes","Solo una entrevista con el denunciado","Solo una entrevista con la víctima"],"a":1,"r":"6.2 Fase de desarrollo"},{"id":219,"b":"Protocolo de acoso","q":"En la fase de resolución, si existen indicios racionales de una posible situación de acoso, se instará:","o":["La adopción de medidas cautelares si es necesario y se convocará de forma urgente a la comisión de prevención del acoso","El archivo directo","Una mediación obligatoria","Una nueva investigación"],"a":0,"r":"6.3 Fase de resolución"},{"id":220,"b":"Protocolo de acoso","q":"Si se constata que la denuncia se hizo de forma no honesta o dolosa, la comisión de prevención del acoso podrá:","o":["Notificarlo al Comité de empresa","Imponer una sanción directa","Archivar sin consecuencias","Instar a RRHH a iniciar la correspondiente actuación disciplinaria"],"a":3,"r":"6.3 Fase de resolución"},{"id":221,"b":"Protocolo de acoso","q":"Se considerará denuncia falsa aquella en la que concurran simultáneamente:","o":["Que sea anónima y sin testigos","Que carezca de justificación y fundamento, y que se haya presentado con mala fe o con el único fin de dañar a la persona denunciada o a la empresa","Que la persona denunciante no ratifique","Que no se pueda probar"],"a":1,"r":"6.3 Fase d n del compañero","La ficha de seguridad del producto"],"a":3,"r":"DINSST-genérico"},{"id":598,"b":"DINSST","q":"En el repostaje se debe:","o":["Repostar con motor en marcha","Dejar la manguera puesta","Fumar si no hay nadie","No fumar, apagar el motor y colocar la manguera en el soporte del surtidor antes de arrancar"],"a":3,"r":"DINSST-genérico"},{"id":599,"b":"DINSST","q":"Si el vehículo eléctrico necesita carga, se hace:","o":["Según el manual de uso del equipo","Con cualquier cable","Sin instrucciones","En la calle"],"a":0,"r":"DINSST-genérico"},{"id":600,"b":"DINSST","q":"Los vehículos con asiento ocupado con freno automático requieren presión hidráulica para soltarse. ¿Qué no se debe hacer?","o":["Depositar materiales pesados sobre el asiento","Usar el cinturón","Mirar el espejo","Sentarse"],"a":0,"r":"DINSST-077/0109"}];
const L="ABCD",BL=[...new Set(Q.map(x=>x.b))],PA=0.5,PE=0.16,KEY="emaya_jefe_sector_600_fallos";
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const app=document.getElementById("app");
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
// tema claro/oscuro automático
const mq=matchMedia("(prefers-color-scheme: dark)");
const setTheme=()=>document.documentElement.setAttribute("data-bs-theme",mq.matches?"dark":"light");
setTheme();mq.addEventListener("change",setTheme);

let fails=new Set();
try{fails=new Set(JSON.parse(localStorage.getItem(KEY)||"[]"))}catch(e){}
const saveFails=()=>{try{localStorage.setItem(KEY,JSON.stringify([...fails]))}catch(e){}};
let cfg={blocks:new Set(BL),n:20,mode:"examen"},S=null;

function home(){
  const pool=Q.filter(x=>cfg.blocks.has(x.b)),cnt=cfg.n?Math.min(cfg.n,pool.length):pool.length;
  app.innerHTML=`
  <div class="card shadow-sm mb-3"><div class="card-body">
    <h1 class="h4">Configura tu test</h1>
    <p class="text-body-secondary mb-0">${Q.length} preguntas · acierto +${PA} · error −${PE} · en blanco 0</p>
  </div></div>
  <div class="card shadow-sm mb-3"><div class="card-body">
    <h2 class="h6">Bloques</h2>
    ${BL.map((b,i)=>`<div class="form-check"><input class="form-check-input" type="checkbox" id="b${i}" data-b="${esc(b)}" ${cfg.blocks.has(b)?"checked":""}>
      <label class="form-check-label" for="b${i}">${esc(b)} <span class="badge text-bg-secondary">${Q.filter(x=>x.b===b).length}</span></label></div>`).join("")}
    <h2 class="h6 mt-3">Número de preguntas</h2>
    <div class="btn-group flex-wrap" role="group">${[10,20,40,60,0].map(n=>`<input type="radio" class="btn-check" name="n" id="n${n}" value="${n}" ${cfg.n===n?"checked":""}><label class="btn btn-outline-primary" for="n${n}">${n||"Todas"}</label>`).join("")}</div>
    <h2 class="h6 mt-3">Modo</h2>
    <div class="form-check"><input class="form-check-input" type="radio" name="m" id="m1" value="examen" ${cfg.mode==="examen"?"checked":""}><label class="form-check-label" for="m1">Examen · corrección al final</label></div>
    <div class="form-check"><input class="form-check-input" type="radio" name="m" id="m2" value="practica" ${cfg.mode==="practica"?"checked":""}><label class="form-check-label" for="m2">Práctica · corrección inmediata</label></div>
  </div></div>
  <div class="d-flex flex-wrap gap-2">
    <button class="btn btn-primary btn-lg" id="go" ${pool.length?"":"disabled"}>Empezar (${cnt})</button>
    ${fails.size?`<button class="btn btn-outline-danger btn-lg" id="rf">Repasar mis fallos (${fails.size})</button><button class="btn btn-link text-danger" id="cf">Borrar fallos</button>`:""}
  </div>`;
  app.querySelectorAll("[data-b]").forEach(e=>e.onchange=()=>{e.checked?cfg.blocks.add(e.dataset.b):cfg.blocks.delete(e.dataset.b);home()});
  app.querySelectorAll("[name=n]").forEach(e=>e.onchange=()=>{cfg.n=+e.value;home()});
  app.querySelectorAll("[name=m]").forEach(e=>e.onchange=()=>{cfg.mode=e.value});
  document.getElementById("go").onclick=()=>start(shuffle(pool).slice(0,cfg.n||pool.length),cfg.mode);
  const rf=document.getElementById("rf");
  if(rf){rf.onclick=()=>start(shuffle(Q.filter(x=>fails.has(x.id))),cfg.mode);document.getElementById("cf").onclick=()=>{fails.clear();saveFails();home()}}
}
function start(qs,mode){S={qs,mode,i:0,ans:{},done:{}};show();scrollTo(0,0)}

function show(){
  const q=S.qs[S.i],a=S.ans[S.i],fin=S.done[S.i],prac=S.mode==="practica",N=S.qs.length;
  const cls=k=>{if(prac&&fin){if(k===q.a)return"list-group-item-success";if(k===a)return"list-group-item-danger"}return a===k?"active":""};
  app.innerHTML=`
  <div class="d-flex justify-content-between align-items-center mb-2">
    <span class="text-body-secondary small">Pregunta ${S.i+1} de ${N} · <span class="badge text-bg-info">${esc(q.b)}</span></span>
    <button class="btn btn-sm btn-outline-secondary" id="ex">Salir</button></div>
  <div class="progress mb-3" role="progressbar" aria-valuenow="${S.i+1}" aria-valuemin="0" aria-valuemax="${N}"><div class="progress-bar" style="width:${(S.i+1)/N*100}%"></div></div>
  <div class="card shadow-sm"><div class="card-body">
    <p class="fw-semibold fs-5">${esc(q.q)}</p>
    <div class="list-group">${q.o.map((t,k)=>`<button type="button" class="list-group-item list-group-item-action opt ${cls(k)}" data-k="${k}"><span class="letter">${L[k]}</span> ${esc(t)}</button>`).join("")}</div>
    ${prac&&fin?`<div class="alert ${a===q.a?"alert-success":"alert-danger"} mt-3 mb-0">${a===q.a?"✔ Correcto":"✘ Incorrecto · la respuesta correcta es la "+L[q.a]}<div class="small mt-1">Fuente: ${esc(q.r)}</div></div>`:""}
  </div></div>
  <div class="d-flex justify-content-between mt-3">
    <button class="btn btn-outline-primary" id="pv" ${S.i?"":"disabled"}>← Anterior</button>
    ${S.i<N-1?`<button class="btn btn-primary" id="nx">${prac||a!==undefined?"Siguiente →":"Saltar →"}</button>`:`<button class="btn btn-success" id="fn">Finalizar</button>`}
  </div>`;
  document.getElementById("ex").onclick=()=>{if(confirm("¿Salir del test?"))home()};
  app.querySelectorAll(".opt").forEach(e=>e.onclick=()=>{
    const k=+e.dataset.k;
    if(prac){if(fin)return;S.ans[S.i]=k;S.done[S.i]=true}
    else{if(S.ans[S.i]===k)delete S.ans[S.i];else S.ans[S.i]=k}
    show()});
  document.getElementById("pv").onclick=()=>{S.i--;show()};
  const nx=document.getElementById("nx");if(nx)nx.onclick=()=>{S.i++;show();scrollTo(0,0)};
  const fn=document.getElementById("fn");
  if(fn)fn.onclick=()=>{const u=N-Object.keys(S.ans).length;if(!u||confirm(u+" sin responder (puntúan 0). ¿Finalizar?"))result()};
}

function result(){
  const N=S.qs.length;let ok=0,ko=0;const per={};
  S.qs.forEach((q,i)=>{const a=S.ans[i],p=per[q.b]=per[q.b]||{n:0,ok:0,ko:0};p.n++;
    if(a===undefined)return;if(a===q.a){ok++;p.ok++;fails.delete(q.id)}else{ko++;p.ko++;fails.add(q.id)}});
  saveFails();
  const sc=ok*PA-ko*PE,n10=Math.max(0,sc/(N*PA)*10),pass=n10>=5;
  const rev=S.qs.map((q,i)=>({q,a:S.ans[i]})).filter(x=>x.a!==x.q.a);
  app.innerHTML=`
  <div class="card shadow-sm mb-3 text-center"><div class="card-body">
    <div class="display-4 fw-bold ${pass?"text-success":"text-danger"}">${n10.toFixed(2)}<small class="fs-5 text-body-secondary"> / 10</small></div>
    <p class="mb-2">Puntuación <b>${sc.toFixed(2)}</b> de ${(N*PA).toFixed(1)}</p>
    <span class="badge text-bg-success">Aciertos ${ok}</span> <span class="badge text-bg-danger">Fallos ${ko}</span> <span class="badge text-bg-secondary">En blanco ${N-ok-ko}</span>
  </div></div>
  <div class="card shadow-sm mb-3"><div class="table-responsive"><table class="table table-sm mb-0 align-middle">
    <thead><tr><th>Bloque</th><th class="text-center">Preg.</th><th class="text-center">✔</th><th class="text-center">✘</th></tr></thead>
    <tbody>${Object.entries(per).map(([b,p])=>`<tr><td>${esc(b)}</td><td class="text-center">${p.n}</td><td class="text-center">${p.ok}</td><td class="text-center">${p.ko}</td></tr>`).join("")}</tbody></table></div></div>
  <div class="d-flex flex-wrap gap-2 mb-3"><button class="btn btn-primary" id="rt">Repetir fallos y blancos</button><button class="btn btn-outline-secondary" id="hm">Inicio</button></div>
  <h2 class="h5">Revisión (${rev.length})</h2>
  ${rev.length?`<div class="accordion" id="acc">${rev.map(({q,a},i)=>`<div class="accordion-item"><h3 class="accordion-header"><button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#r${i}">${a===undefined?"⚪":"❌"}&nbsp;${esc(q.q)}</button></h3>
    <div id="r${i}" class="accordion-collapse collapse" data-bs-parent="#acc"><div class="accordion-body">
      <p class="text-danger mb-1">${a===undefined?"En blanco":"Tu respuesta: "+L[a]+") "+esc(q.o[a])}</p>
      <p class="text-success mb-1">Correcta: ${L[q.a]}) ${esc(q.o[q.a])}</p><small class="text-body-secondary">Fuente: ${esc(q.r)}</small></div></div></div>`).join("")}</div>`:`<div class="alert alert-success">¡Sin fallos!</div>`}`;
  document.getElementById("hm").onclick=home;
  document.getElementById("rt").onclick=()=>rev.length?start(shuffle(rev.map(x=>x.q)),S.mode):home();
  scrollTo(0,0);
}
home();
</script>
</body>
</html>
