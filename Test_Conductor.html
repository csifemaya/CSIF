ame"], "a": 1, "e": "Tema 12: Delimitar y señalizar, aplicar absorbentes, limpiar con equipos especiales y coordinarse con Policía Local o Bomberos.", "pg": "77-82"}, {"t": 13, "q": "¿Cuáles son los vehículos exclusivos del C1/CR1?", "o": ["GOUPIL y barredora ligera", "Tractora RSM y PALITO", "Recolector lateral y bilateral, Ampliroll, Camión Cuba y Camión Grúa", "Fregadora y decapadora"], "a": 2, "e": "Tema 13: Recolector lateral y bilateral, Ampliroll, Camión Cuba y Camión Grúa.", "pg": "83-87"}, {"t": 13, "q": "¿Cómo se debe acceder a la cabina en recolectores laterales, bilaterales y Ampliroll?", "o": ["Con dos manos y saltando", "Sin asideros", "De espaldas", "Con tres de las cuatro extremidades en contacto firme, mirando hacia la cabina"], "a": 3, "e": "Tema 13: Con tres de las cuatro extremidades en contacto firme, mirando hacia la cabina.", "pg": "83-87"}, {"t": 13, "q": "Al coger el contenedor con el elevador, ¿qué debe tener el camión lateral/bilateral?", "o": ["El freno de mano puesto, siguiendo la operación por el monitor de TV", "Los estribos ocupados", "El motor en punto muerto", "Las luces apagadas"], "a": 0, "e": "Tema 13: El freno de mano puesto, siguiendo la operación por el monitor de TV.", "pg": "83-87"}, {"t": 13, "q": "¿Se puede desplazar el vehículo bilateral con el contenedor suspendido?", "o": ["No", "Sí, a baja velocidad", "Solo de noche", "Sí, en trayectos cortos"], "a": 0, "e": "Tema 13: No.", "pg": "83-87"}, {"t": 13, "q": "En recogida lateral, ¿cuándo puede desplazarse el vehículo con el contenedor sobre los brazos elevados?", "o": ["Hasta el siguiente punto", "Nunca", "Solo para centrarlo, ajustarlo en los soportes o moverlo dentro de la batería", "En cualquier trayecto"], "a": 2, "e": "Tema 13: Solo para centrarlo, ajustarlo en los soportes o moverlo dentro de la batería.", "pg": "83-87"}, {"t": 13, "q": "Si el contenedor cae dentro de la tolva durante la descarga, ¿qué hay que hacer?", "o": ["Tirar de él con el camión", "Continuar la ruta", "Avisar a talleres; si sobresale no se puede circular", "Vaciarlo en la calle"], "a": 2, "e": "Tema 13: Avisar a talleres; si sobresale no se puede circular.", "pg": "83-87"}, {"t": 13, "q": "Si el contenedor no encaja en los posicionadores, ¿qué se permite?", "o": ["Pequeños movimientos manuales; si sigue sin encajar, avisar al jefe de sector", "Golpearlo", "Dejarlo fuera", "Forzarlo con el brazo"], "a": 0, "e": "Tema 13: Pequeños movimientos manuales; si sigue sin encajar, avisar al jefe de sector.", "pg": "83-87"}, {"t": 13, "q": "Si cae un contenedor, ¿a quién hay que llamar para pedir ayuda y levantarlo?", "o": ["A Tirme", "Al 112 siempre", "A un ciudadano", "Al jefe de sector"], "a": 3, "e": "Tema 13: Al jefe de sector.", "pg": "83-87"}, {"t": 13, "q": "En las descargas en el foso de Tirme, ¿dónde debe abrirse y cerrarse la caja?", "o": ["En el mismo borde", "Delante del acceso", "Dentro del foso", "En un punto alejado del borde del foso"], "a": 3, "e": "Tema 13: En un punto alejado del borde del foso.", "pg": "83-87"}, {"t": 13, "q": "Con el Ampliroll, ¿quién debe estar en el radio de acción mientras se maniobra?", "o": ["Nadie", "El peón", "El jefe de sector", "El cliente"], "a": 0, "e": "Tema 13: Nadie.", "pg": "83-87"}, {"t": 13, "q": "Antes de cargar cajas compactadoras, ¿qué debe asegurarse?", "o": ["Que las puertas están abiertas", "Que están enchufadas", "Que están desenchufadas y con las puertas traseras bien cerradas", "Que están llenas"], "a": 2, "e": "Tema 13: Que están desenchufadas y con las puertas traseras bien cerradas.", "pg": "83-87"}, {"t": 13, "q": "En los Puntos Verdes, ¿quién abre y cierra las cajas?", "o": ["El usuario", "El conductor", "El jefe de sector", "El peón"], "a": 1, "e": "Tema 13: El conductor.", "pg": "83-87"}, {"t": 13, "q": "¿Qué debe comprobarse sobre las uñas de seguridad antes de iniciar la marcha con la caja?", "o": ["Que están retiradas", "Que están engrasadas", "Que están bien colocadas y cerradas", "Que están levantadas"], "a": 2, "e": "Tema 13: Que están bien colocadas y cerradas.", "pg": "83-87"}, {"t": 13, "q": "Antes de iniciar la marcha con el Ampliroll, ¿cómo debe estar el rodillo trasero?", "o": ["Girando", "Desmontado", "Arriba", "Abajo"], "a": 2, "e": "Tema 13: Arriba.", "pg": "83-87"}, {"t": 13, "q": "¿Cuándo debe colocarse la lona de protección en el suelo?", "o": ["Nunca", "Al llegar a descargar", "Después de cargar", "Antes de cargar la caja, si hace falta"], "a": 3, "e": "Tema 13: Antes de cargar la caja, si hace falta.", "pg": "83-87"}, {"t": 13, "q": "Al subir la caja al Ampliroll, ¿cómo debe quedar?", "o": ["Lo más adelantada posible sobre la plataforma, para que sobresalga lo menos posible", "Lo más atrasada posible", "Colgando", "Sin ajuste"], "a": 0, "e": "Tema 13: Lo más adelantada posible sobre la plataforma, para que sobresalga lo menos posible.", "pg": "83-87"}, {"t": 13, "q": "¿Qué no debe hacerse con la toma de fuerza del Ampliroll?", "o": ["Desconectarla al terminar", "Circular con ella conectada", "Comprobar su estado", "Conectarla para elevar la caja"], "a": 1, "e": "Tema 13: Circular con ella conectada.", "pg": "83-87"}, {"t": 13, "q": "Antes de iniciar la descarga del Ampliroll, ¿qué debe asegurarse respecto a la puerta?", "o": ["Que está soldada", "Que la puerta de la caja está abierta y permite el vaciado", "Que está cerrada", "Que no existe"], "a": 1, "e": "Tema 13: Que la puerta de la caja está abierta y permite el vaciado.", "pg": "83-87"}, {"t": 13, "q": "¿Qué riesgo hay si se bascula una caja cerrada?", "o": ["Ninguno", "Mejora el vaciado", "Perder estabilidad, con consecuencias graves", "Ahorra tiempo"], "a": 2, "e": "Tema 13: Perder estabilidad, con consecuencias graves.", "pg": "83-87"}, {"t": 13, "q": "Para iniciar el baldeo con pértiga superior en el Camión Cuba, ¿qué se hace primero?", "o": ["Subir la pértiga", "Desanclar la pértiga del gancho del techo tirando hacia abajo", "Encender el rotativo", "Parar el motor"], "a": 1, "e": "Tema 13: Desanclar la pértiga del gancho del techo tirando hacia abajo.", "pg": "83-87"}, {"t": 13, "q": "Al desplegar la manguera del carrete, ¿qué hay que escuchar?", "o": ["La emisora", "El motor", "La sirena", "El freno del carrete, para que no recoja cuando no se necesita"], "a": 3, "e": "Tema 13: El freno del carrete, para que no recoja cuando no se necesita.", "pg": "83-87"}, {"t": 13, "q": "¿Desde dónde se activa el servicio de baldeo con pértiga?", "o": ["Desde el cuadro de control trasero, coordinándose con el conductor que activa la presión desde cabina", "Desde la cabina sin coordinación", "Desde un móvil", "Desde el taller"], "a": 0, "e": "Tema 13: Desde el cuadro de control trasero, coordinándose con el conductor que activa la presión desde cabina.", "pg": "83-87"}, {"t": 13, "q": "Al recoger la manguera tras el baldeo, ¿qué debe hacerse primero?", "o": ["Apagar el camión sin avisar", "Soltar la pistola con agua", "Tirar de la manguera con presión", "Avisar al conductor, cortar el servicio de agua en el cuadro trasero y dejar la pistola sin presión"], "a": 3, "e": "Tema 13: Avisar al conductor, cortar el servicio de agua en el cuadro trasero y dejar la pistola sin presión.", "pg": "83-87"}, {"t": 13, "q": "¿Qué debe hacerse con la punta de la pértiga al terminar?", "o": ["Anclarla en su soporte para evitar accidentes con el vehículo en movimiento", "Dejarla suelta", "Dejarla en el suelo", "Cortarla"], "a": 0, "e": "Tema 13: Anclarla en su soporte para evitar accidentes con el vehículo en movimiento.", "pg": "83-87"}, {"t": 13, "q": "En el apoyo a Bomberos con el Camión Cuba, ¿por qué salida debe priorizarse la conexión?", "o": ["Por la boca de hombre", "Por la salida sin presión", "Por la salida de presión lateral, con toma a ambos lados de la cuba, la más cercana a la cabina", "Por la salida trasera siempre"], "a": 2, "e": "Tema 13: Por la salida de presión lateral, con toma a ambos lados de la cuba, la más cercana a la cabina.", "pg": "83-87"}, {"t": 13, "q": "Si se conecta en la salida sin presión (junto a la rueda trasera), ¿qué debe hacerse antes de abrir la llave?", "o": ["Abrir la boca de hombre del techo de la cuba, lo hace el personal de bomberos", "Llamar a Tirme", "Cerrar la cuba", "Apagar el motor"], "a": 0, "e": "Tema 13: Abrir la boca de hombre del techo de la cuba, lo hace el personal de bomberos.", "pg": "83-87"}, {"t": 13, "q": "¿Por qué no se debe acceder a la boca de hombre sin medios auxiliares?", "o": ["Porque está caliente", "Porque es muy pequeña", "Porque la altura supera los 2 metros", "Porque está bajo tierra"], "a": 2, "e": "Tema 13: Porque la altura supera los 2 metros.", "pg": "83-87"}, {"t": 13, "q": "¿Qué norma regula la seguridad en los trabajos con Camión Grúa?", "o": ["FDS", "ITSSST 011", "ITSSST-101", "IT de RSM"], "a": 1, "e": "Tema 13: ITSSST 011.", "pg": "83-87"}, {"t": 13, "q": "¿Qué es el monitor de TV del recolector lateral/bilateral?", "o": ["Un tacógrafo", "Un sistema de ocio", "Un GPS", "Un sistema de visión trasera para seguir la operación de descarga del contenedor"], "a": 3, "e": "Tema 13: Un sistema de visión trasera para seguir la operación de descarga del contenedor.", "pg": "83-87"}, {"t": 13, "q": "¿Qué es el posicionador?", "o": ["El elemento del suelo donde encaja el contenedor de recogida lateral", "El brazo hidráulico", "Un sensor del camión", "Una llave"], "a": 0, "e": "Tema 13: El elemento del suelo donde encaja el contenedor de recogida lateral.", "pg": "83-87"}];
const TEMAS={"1": "Palma, EMAYA y la organización de los servicios de Calidad Urbana", "2": "Organización de Calidad Urbana y funciones del personal conductor", "3": "Los residuos gestionados por EMAYA y los servicios específicos de recogida", "4": "Medidas preventivas generales y comunes a C1/CR1 y CR2", "5": "Calidad, medio ambiente y atención a la ciudadanía", "6": "Procedimientos operativos", "7": "Sistemas de recogida y limpieza", "8": "Vehículos y equipos de trabajo", "9": "Medidas específicas del Conductor de 2.ª", "10": "Vehículos y sistemas avanzados de recogida", "11": "Vehículos y equipos avanzados de limpieza", "12": "Procedimientos operativos avanzados", "13": "Medidas específicas del Conductor de 1.ª"};
const $=id=>document.getElementById(id);
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let N=20,sel=new Set(Object.keys(TEMAS).map(Number)),pool=[],i=0,score=0,wrong=[],done=false;
$('tot').textContent=DATA.length;
const nums=[10,20,30,50,100,DATA.length];
function drawNums(){$('nums').innerHTML='';nums.forEach(n=>{const b=document.createElement('button');b.className='chip'+(n===N?' on':'');b.textContent=n===DATA.length?'Todas':n;b.onclick=()=>{N=n;drawNums()};$('nums').appendChild(b)})}
function avail(){const c=DATA.filter(q=>sel.has(q.t)).length;$('avail').textContent=c+' preguntas disponibles con los temas elegidos.';$('go').disabled=c===0}
function drawTemas(){$('temas').innerHTML='';Object.entries(TEMAS).forEach(([k,v])=>{k=+k;const l=document.createElement('label');const c=document.createElement('input');c.type='checkbox';c.checked=sel.has(k);c.onchange=()=>{c.checked?sel.add(k):sel.delete(k);avail()};l.append(c,document.createTextNode('T'+k+' · '+v));$('temas').appendChild(l)});avail()}
const setSel=a=>{sel=new Set(a);drawTemas()};
$('all').onclick=()=>setSel(Object.keys(TEMAS).map(Number));
$('com').onclick=()=>setSel([1,2,3,4,5,6]);$('cr2').onclick=()=>setSel([7,8,9]);$('cr1').onclick=()=>setSel([10,11,12,13]);
function show(id){['setup','quiz','res'].forEach(x=>$(x).classList.toggle('hide',x!==id));window.scrollTo(0,0)}
function start(list){pool=sh(list).map(q=>{const o=sh(q.o.map((t,k)=>({t,ok:k===q.a})));return{...q,opts:o}});i=0;score=0;wrong=[];show('quiz');render()}
$('go').onclick=()=>{const l=DATA.filter(q=>sel.has(q.t));start(l.length>N?sh(l).slice(0,N):l)};
function render(){const q=pool[i];done=false;$('cnt').textContent='Pregunta '+(i+1)+' de '+pool.length+' · Aciertos: '+score;$('tg').textContent='Tema '+q.t;
$('pb').style.width=(i/pool.length*100)+'%';$('qt').textContent=q.q;$('ops').innerHTML='';$('ex').classList.add('hide');$('nx').classList.add('hide');
q.opts.forEach((o,k)=>{const b=document.createElement('button');b.className='opt';b.innerHTML='<b>'+'ABCD'[k]+'</b><span></span>';b.lastChild.textContent=o.t;b.onclick=()=>answer(k);$('ops').appendChild(b)})}
function answer(k){if(done)return;done=true;const q=pool[i];const bs=$('ops').children;
q.opts.forEach((o,j)=>{bs[j].disabled=true;if(o.ok)bs[j].classList.add('ok')});
if(q.opts[k].ok){score++}else{bs[k].classList.add('ko');wrong.push({q,pick:q.opts[k].t})}
$('ex').textContent=(q.opts[k].ok?'✔ ¡Correcto! ':'✘ Incorrecto. ')+q.e+' (Manual, págs. '+q.pg+')';$('ex').classList.remove('hide');
$('cnt').textContent='Pregunta '+(i+1)+' de '+pool.length+' · Aciertos: '+score;
$('nx').textContent=i===pool.length-1?'Ver resultado':'Siguiente';$('nx').classList.remove('hide');$('nx').focus()}
$('nx').onclick=()=>{if(i<pool.length-1){i++;render()}else finish()};
$('qs').onclick=()=>{if(confirm('¿Abandonar el test?'))show('setup')};
function finish(){show('res');const n=pool.length,p=Math.round(score/n*100);$('sc').textContent=score+' / '+n+' ('+p+' %)';
$('msg').textContent=p>=90?'Excelente: dominas este contenido.':p>=70?'Buen resultado. Repasa los fallos para afianzar.':p>=50?'Aprobado justo: conviene repasar los temas fallados.':'Necesitas repasar el manual antes de volver a intentarlo.';
$('retry').classList.toggle('hide',!wrong.length);
$('rv').innerHTML='';if(wrong.length){const h=document.createElement('h2');h.textContent='Preguntas falladas';$('rv').appendChild(h)}
wrong.forEach(w=>{const d=document.createElement('div');d.className='rev';const c=w.q.opts.find(o=>o.ok).t;
d.innerHTML='<small>Tema '+w.q.t+' · págs. '+w.q.pg+'</small><div><b></b></div><div class="sub">Tu respuesta: <span class="a"></span></div><div>Correcta: <span class="c"></span></div>';
d.querySelector('b').textContent=w.q.q;d.querySelector('.a').textContent=w.pick;d.querySelector('.c').textContent=c;$('rv').appendChild(d)});
try{const h=JSON.parse(localStorage.getItem('emaya_hist')||'[]');h.unshift({d:new Date().toLocaleDateString('es-ES'),s:score,n});localStorage.setItem('emaya_hist',JSON.stringify(h.slice(0,5)))}catch(e){}}
$('again').onclick=()=>{show('setup');drawHist()};
$('retry').onclick=()=>start(wrong.map(w=>DATA.find(d=>d.q===w.q.q)));
function drawHist(){try{const h=JSON.parse(localStorage.getItem('emaya_hist')||'[]');if(!h.length)return;$('hist').classList.remove('hide');$('hist').innerHTML='<h2 style="margin-top:0">Últimos tests</h2>'+h.map(x=>'<div class="sub">'+x.d+' · '+x.s+'/'+x.n+' ('+Math.round(x.s/x.n*100)+' %)</div>').join('')}catch(e){}}
drawNums();drawTemas();drawHist();
</script></body></html>
