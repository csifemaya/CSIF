<script>
const Q=[{"id":1,"b":"Código ético y de conducta","q":"¿Cuántos años de historia menciona EMAYA en la introducción de su Código ético?","o":["Más de 100","Más de 25","Más de 50","Más de 75"],"a":3,"r":"Introducción"},{"id":2,"b":"Código ético y de conducta","q":"¿Cuál es la finalidad del Código ético y de conducta de EMAYA?","o":["Desarrollar pautas de comportamiento profesional, ético y socialmente responsable, prevenir conductas ilícitas y establecer mecanismos de seguimiento y control","Fijar las condiciones retributivas de la plantilla","Regular únicamente la relación con la clientela","Establecer exclusivamente el régimen sancionador del personal"],"a":0,"r":"Introducción"},{"id":3,"b":"Código ético y de conducta","q":"¿A quién va dirigido el Código ético?","o":["A todas las personas que integran EMAYA (plantilla, Dirección y Consejo de Administración) y a quienes trabajan o colaboran con ella","Solo a la plantilla con contrato fijo","Solo a la Dirección y al Consejo de Administración","Únicamente a las empresas proveedoras"],"a":0,"r":"Introducción: ¿A quién va dirigido?"},{"id":4,"b":"Código ético y de conducta","q":"¿Cuál de las siguientes actividades NO figura entre las áreas de actividad de la misión de EMAYA?","o":["Generación de energía renovable y comercialización de electricidad y gas","Limpieza viaria y recogida selectiva de residuos","Gestión del transporte público urbano","Abastecimiento de agua potable, saneamiento y depuración de aguas residuales"],"a":2,"r":"Misión"},{"id":5,"b":"Código ético y de conducta","q":"Según su visión, ¿qué quiere ser EMAYA?","o":["Una empresa líder en rentabilidad económica","Una empresa referente exclusivamente en gestión del agua","La mayor empresa de servicios de las Illes Balears","Una empresa pública de referencia en calidad del servicio, innovación y sostenibilidad"],"a":3,"r":"Visión"},{"id":6,"b":"Código ético y de conducta","q":"¿Cuál de los siguientes NO es uno de los valores de EMAYA?","o":["Integridad","Servicio","Rentabilidad","Sostenibilidad"],"a":2,"r":"Valores"},{"id":7,"b":"Código ético y de conducta","q":"En el Código ético, el valor «Integridad» se refiere a:","o":["La relación con el Comité de empresa","El trato con las empresas competidoras","La gestión de los recursos públicos","La seguridad de las instalaciones"],"a":2,"r":"Valores"},{"id":8,"b":"Código ético y de conducta","q":"En el Código ético, el valor «Personas» expresa preocupación por:","o":["La plantilla (principal activo) y las personas usuarias","Las empresas proveedoras y contratistas","Solo las personas usuarias","Solo la plantilla"],"a":0,"r":"Valores"},{"id":9,"b":"Código ético y de conducta","q":"¿Qué engloba el valor «Sostenibilidad» según el Código?","o":["Reducción de costes y optimización de tarifas","Economía circular, protección medioambiental, energía renovable y movilidad sostenible","Digitalización de los trámites con la clientela","Formación continua de la plantilla"],"a":1,"r":"Valores"},{"id":10,"b":"Código ético y de conducta","q":"¿Qué recoge el valor «Servicio»?","o":["Prioridad al servicio de agua sobre el resto","Cumplimiento estricto del horario laboral","Vocación de servicio a los usuarios y usuarias, con interacción amigable y digital","Atención presencial exclusiva"],"a":2,"r":"Valores"},{"id":11,"b":"Código ético y de conducta","q":"Según la misión, en todas sus operaciones EMAYA pone el foco en:","o":["La comercialización de energía exclusivamente","La satisfacción de los usuarios y usuarias y el cuidado del medioambiente, primando la seguridad de las personas y las instalaciones","La reducción de plantilla y la rentabilidad","La expansión a otros municipios"],"a":1,"r":"Misión"},{"id":12,"b":"Código ético y de conducta","q":"¿Qué estándar de calidad exige EMAYA a todas las personas, según el apartado «Compromiso»?","o":["Un estándar flexible según el puesto","Un estándar mínimo exigido por ley","Un estándar de calidad especialmente elevado","Un estándar acordado en convenio"],"a":2,"r":"La persona: Compromiso"},{"id":13,"b":"Código ético y de conducta","q":"Las actuaciones de EMAYA y de las personas que se relacionan con ella deben estar presididas por los principios de:","o":["Lealtad y buena fe","Confidencialidad y reserva","Competitividad y rentabilidad","Jerarquía y disciplina"],"a":0,"r":"La persona: Compromiso"},{"id":14,"b":"Código ético y de conducta","q":"En el apartado «Entorno de trabajo», EMAYA se esfuerza por crear entornos donde impere:","o":["La productividad por encima de todo","La jerarquía estricta","La competitividad entre equipos","La confianza, el respeto a la dignidad de las personas, la cordialidad y el trabajo en equipo"],"a":3,"r":"La persona: Entorno de trabajo"},{"id":15,"b":"Código ético y de conducta","q":"¿De quién es la responsabilidad de generar y mantener un ambiente de trabajo agradable, gratificante y seguro?","o":["Del Comité de Ética","Solo del servicio de prevención","Solo de la Dirección","De todos y todas"],"a":3,"r":"La persona: Entorno de trabajo"},{"id":16,"b":"Código ético y de conducta","q":"¿Qué garantiza EMAYA en materia de oportunidades?","o":["La absoluta igualdad de oportunidades","La promoción automática por antigüedad","La igualdad solo en el acceso al empleo","La igualdad solo para personal fijo"],"a":0,"r":"La persona: Diversidad e igualdad"},{"id":17,"b":"Código ético y de conducta","q":"Respecto a la formación, el personal de EMAYA se compromete a:","o":["Participar en los programas de formación en la medida que sea requerido y esforzarse por obtener el máximo aprovechamiento","Costear su propia formación","Realizar formación solo en horario no laboral","Participar únicamente en formación voluntaria"],"a":0,"r":"La persona: Diversidad e igualdad"},{"id":18,"b":"Código ético y de conducta","q":"EMAYA respeta los derechos de:","o":["Huelga exclusivamente","Negociación individual de condiciones","Sindicación solo para personal fijo","Sindicación, asociación y negociación colectiva"],"a":3,"r":"La persona: Derechos laborales"},{"id":19,"b":"Código ético y de conducta","q":"¿Qué objetivos persigue la relación con las organizaciones representativas de los trabajadores y trabajadoras?","o":["Reducción de costes salariales","Aumento de la productividad","Paz social y estabilidad laboral","Reducción del absentismo"],"a":2,"r":"La persona: Derechos laborales"},{"id":20,"b":"Código ético y de conducta","q":"Las directrices de seguridad marcadas por la organización deben ser adoptadas por cada empleado y empleada:","o":["Solo en trabajos de riesgo alto","Sin ningún tipo de reserva","Con las reservas que cada persona estime","Previa consulta con el comité"],"a":1,"r":"La persona: Derechos laborales"},{"id":21,"b":"Código ético y de conducta","q":"¿Qué obligación establece EMAYA en materia de confidencialidad?","o":["Publicar toda la información interna","Informar a la clientela de todos los datos de la empresa","Mantener la debida confidencialidad en el tratamiento de datos o informaciones no públicas de EMAYA o de terceros","Compartir datos con otras administraciones sin límite"],"a":2,"r":"La persona: Confidencialidad"},{"id":22,"b":"Código ético y de conducta","q":"Los datos de carácter personal se tratan en EMAYA de forma:","o":["Especialmente restrictiva, obteniendo únicamente los necesarios","Abierta y compartida entre departamentos","Libre mientras no se publiquen","Solo restrictiva para el personal laboral"],"a":0,"r":"La persona: Confidencialidad"},{"id":23,"b":"Código ético y de conducta","q":"Respecto a los recursos de EMAYA, ¿qué se exige?","o":["Un uso responsable para que se lleven a cabo correctamente las funciones propias de cada persona","Uso libre para fines personales","Uso limitado a horario laboral y sin excepciones","Uso exclusivo de la Dirección"],"a":0,"r":"La persona: Los recursos de EMAYA"},{"id":24,"b":"Código ético y de conducta","q":"¿Quién es responsable de la utilización correcta y la protección de los activos y recursos facilitados por la empresa?","o":["Cada miembro de EMAYA","Solo el departamento de compras","El servicio de prevención","Solo la Dirección"],"a":0,"r":"La persona: Los recursos de EMAYA"},{"id":25,"b":"Código ético y de conducta","q":"¿Qué derechos de terceras personas deben garantizarse en el uso de los recursos?","o":["Solo los datos personales de la clientela","Los derechos y libertades respecto de los datos personales y la propiedad intelectual o industrial","Solo la propiedad industrial","Los derechos de autor del personal"],"a":1,"r":"La persona: Los recursos de EMAYA"},{"id":26,"b":"Código ético y de conducta","q":"¿Cómo debe mantenerse el diálogo con la clientela?","o":["A través de las asociaciones de vecinos","De forma permanente y constructiva, mediante canales de comunicación bidireccionales","Solo mediante atención presencial","Únicamente por escrito"],"a":1,"r":"Relación con la clientela"},{"id":27,"b":"Código ético y de conducta","q":"¿En qué norma deben inspirarse los valores fundamentales que regulan la contratación con empresas proveedoras y contratistas?","o":["En el Código Civil","En el convenio colectivo","En la ordenanza municipal de limpieza","En la norma de contratos del sector público"],"a":3,"r":"Relación con empresas proveedoras"},{"id":28,"b":"Código ético y de conducta","q":"¿Qué valores fundamentales deben estar presentes en la relación con proveedores y contratistas?","o":["La exclusividad y la fidelidad","La confianza y la transparencia","La rapidez y el menor precio","La confidencialidad y la discreción"],"a":1,"r":"Relación con empresas proveedoras"},{"id":29,"b":"Código ético y de conducta","q":"¿Qué política de compra considera vital EMAYA?","o":["Una política de compra sostenible que incentive la contratación de proveedores con políticas de gestión ética y social","Contratar siempre al proveedor más barato","Contratar siempre a los mismos proveedores","Contratar solo a proveedores de Palma"],"a":0,"r":"Relación con empresas proveedoras"},{"id":30,"b":"Código ético y de conducta","q":"Respecto al medio ambiente, las decisiones corporativas en EMAYA deben garantizar:","o":["Un enfoque preventivo del impacto de las operaciones","Un enfoque reactivo ante incidentes","El cumplimiento mínimo de la normativa","La reducción de inversiones ambientales"],"a":0,"r":"El entorno: El medio ambiente"},{"id":31,"b":"Código ético y de conducta","q":"EMAYA garantiza el mismo estándar de exigencia con empresas proveedoras, contratistas y colaboradoras y exige:","o":["Certificaciones ISO en todos los casos","El cumplimiento de los procedimientos y requisitos ambientales aplicables en cada caso","Precios competitivos","La contratación de personal local"],"a":1,"r":"El entorno: El medio ambiente"},{"id":32,"b":"Código ético y de conducta","q":"¿Qué son pilares básicos de la actuación de EMAYA en materia de patrimonio?","o":["Preservar y respetar la ciudad y el patrimonio histórico, cultural y arqueológico, generando el mínimo impacto urbanístico","Financiar actividades culturales","Restaurar edificios históricos","Promocionar el turismo cultural"],"a":0,"r":"El entorno: El patrimonio"},{"id":33,"b":"Código ético y de conducta","q":"En materia de urbanismo y construcción, EMAYA garantiza el cumplimiento de la normativa:","o":["Solo estatal","Solo autonómica","Solo local","Nacional, autonómica y local"],"a":3,"r":"El entorno: El patrimonio"},{"id":34,"b":"Código ético y de conducta","q":"¿Qué criterio adopta EMAYA frente al soborno y la corrupción?","o":["Evaluación caso por caso","Tolerancia limitada a importes pequeños","Tolerancia cero","Tolerancia solo con entidades privadas"],"a":2,"r":"Nosotros: Corrupción y soborno"},{"id":35,"b":"Código ético y de conducta","q":"Cualquier persona expuesta a situaciones de corrupción o soborno debe:","o":["Comunicarlo solo a las autoridades judiciales","Esperar a tener pruebas concluyentes","Conocer la normativa aplicable y comunicar a la empresa lo más rápido posible cualquier hecho o indicio","Resolverlo con la persona implicada"],"a":2,"r":"Nosotros: Corrupción y soborno"},{"id":36,"b":"Código ético y de conducta","q":"En materia de corrupción, EMAYA:","o":["Solo colabora si hay requerimiento judicial","Colabora de forma activa con las autoridades administrativas y judiciales para investigar y depurar responsabilidades","Gestiona los casos internamente sin informar a terceros","Delega la investigación en el Comité de empresa"],"a":1,"r":"Nosotros: Corrupción y soborno"},{"id":37,"b":"Código ético y de conducta","q":"¿Qué conflictos de interés debe evitar el personal?","o":["Cualquier escenario de conflicto, directo o indirecto, entre sus intereses personales y/o laborales y los de la empresa","Solo los que afecten a la contratación","Solo los de carácter económico","Solo los conflictos directos"],"a":0,"r":"Nosotros: Conflictos de interés"},{"id":38,"b":"Código ético y de conducta","q":"Respecto a la transparencia, EMAYA:","o":["Restringe el acceso a la información económica","Cumple las previsiones legales para facilitar el acceso corporativo a la ciudadanía mediante herramientas tecnológicas","Publica solo la información financiera","Publica solo la información que la ciudadanía solicita"],"a":1,"r":"Nosotros: Transparencia"},{"id":39,"b":"Código ético y de conducta","q":"¿Qué principios garantiza EMAYA en los procedimientos de contratación?","o":["Confidencialidad de las ofertas y adjudicación al precio más bajo","Prioridad a proveedores locales y adjudicación directa","Exclusividad y fidelización de proveedores","Libertad de acceso a las licitaciones, publicidad, concurrencia, idoneidad, transparencia, no discriminación, igualdad de trato y justificación de la oferta más ventajosa"],"a":3,"r":"Nosotros: Contratación pública"},{"id":40,"b":"Código ético y de conducta","q":"El personal involucrado en la selección de empresas proveedoras debe abstenerse de participar cuando:","o":["El importe del contrato supere un umbral","La empresa haya trabajado antes con EMAYA","La empresa proveedora sea de fuera de Palma","Haya una situación de conflicto o riesgo de vulneración de la normativa"],"a":3,"r":"Nosotros: Contratación pública"},{"id":41,"b":"Código ético y de conducta","q":"¿Qué debe reflejar la contabilidad mercantil y los registros fiscales de EMAYA?","o":["Un resumen anual de las operaciones","Las operaciones aprobadas por el Consejo","De forma íntegra, precisa y cierta, todas las operaciones económicas y la imagen fiel de las transacciones","Solo las operaciones superiores a un importe"],"a":2,"r":"Nosotros: Información financiera y tributaria"},{"id":42,"b":"Código ético y de conducta","q":"¿Cómo debe ser la gestión de ayudas y subvenciones públicas?","o":["Transparente, destinando en todo momento las cantidades concedidas al propósito de su concesión","Flexible en el destino de los fondos","Sujeta a la aprobación del Ayuntamiento caso a caso","Reservada a la Dirección"],"a":0,"r":"Nosotros: Información financiera y tributaria"},{"id":43,"b":"Código ético y de conducta","q":"En materia de datos personales, EMAYA se obliga a respetar:","o":["Solo la intimidad del personal","La intimidad de los miembros del Consejo","La intimidad personal y familiar del personal y de las personas o entidades con las que se relaciona","Solo la intimidad de la clientela"],"a":2,"r":"Nosotros: Datos personales"},{"id":44,"b":"Código ético y de conducta","q":"¿Quién puede acceder a los datos personales según el Código?","o":["Todo el personal de administración","Solamente los trabajadores y trabajadoras autorizados por sus funciones, en la medida en que resulte necesario","Cualquier persona con contrato fijo","Los mandos intermedios"],"a":1,"r":"Nosotros: Datos personales"},{"id":45,"b":"Código ético y de conducta","q":"La información de carácter no público es considerada:","o":["Pública tras seis meses","Reservada y confidencial, aplicándose mecanismos físicos y lógicos para preservar su integridad, dis "a":3,"r":"Actualización y revisión"},{"id":52,"b":"Código ético y de conducta","q":"¿Qué órgano revisa y actualiza periódicamente el Código y las políticas, procesos y controles necesarios?","o":["El departamento de RRHH","El Comité de empresa","La Dirección Gerencia","El Comité de Ética"],"a":3,"r":"Actualización y revisión"},{"id":53,"b":"Código ético y de conducta","q":"¿Qué puede ocurrir si se incumple la normativa del Código ético?","o":["Aplicación de las sanciones laborales correspondientes según el convenio colectivo o el Estatuto de los Trabajadores","Despido automático","Ninguna consecuencia al no ser sancionador","Amonestación pública"],"a":0,"r":"Actualización y revisión"},{"id":54,"b":"Código ético y de conducta","q":"Según el apartado «Diversidad, igualdad de oportunidades y desarrollo profesional», EMAYA pone los medios para contribuir a:","o":["La promoción por antigüedad","El aprendizaje, la formación y la actualización de conocimientos y competencias para facilitar la empleabilidad y el progreso profesional","La rotación obligatoria de puestos","La reducción de la jornada"],"a":1,"r":"La persona: Diversidad e igualdad"},{"id":55,"b":"Código ético y de conducta","q":"¿Qué compromiso asume EMAYA respecto a la diversidad de sus recursos humanos?","o":["Prioriza determinados colectivos","Trabaja para su integración, garantizando la aplicación colectiva de una misma normativa interna","Aplica normas distintas según el colectivo","Aplica la diversidad solo en la contratación"],"a":1,"r":"La persona: Diversidad e igualdad"},{"id":56,"b":"Ordenanza municipal de limpieza","q":"¿En qué fecha el Ayuntamiento en Pleno resolvió las alegaciones y aprobó definitivamente la ordenanza vigente?","o":["15 de diciembre de 2006","26 de enero de 2017","1 de noviembre de 2016","29 de abril de 2004"],"a":1,"r":"Preámbulo"},{"id":57,"b":"Ordenanza municipal de limpieza","q":"¿Cuándo se aprobó definitivamente la ordenanza anterior que ha sido derogada?","o":["29 de abril d  de gestión","Son infecciosos pero de bajo riesgo"],"a":2,"r":"Art. 3.1.t"},{"id":75,"b":"Ordenanza municipal de limpieza","q":"¿Qué es una «pila» según la ordenanza?","o":["Fuente de energía eléctrica obtenida por transformación directa de energía química, constituida por uno o varios elementos primarios (no recargables)","Cualquier batería recargable","Un acumulador de plomo","Una fuente de energía renovable"],"a":0,"r":"Art. 3.1.v"},{"id":76,"b":"Ordenanza municipal de limpieza","q":"Las «áreas de aportación» son:","o":["Zonas cerradas de titularidad municipal","Lugares o zonas de uso público a disposición del ciudadano para facilitar la recogida selectiva de residuos urbanos no peligrosos, separados en origen","Plantas de tratamiento","Mercados municipales"],"a":1,"r":"Art. 3.1.x"},{"id":77,"b":"Ordenanza municipal de limpieza","q":"¿Cuáles son los residuos «voluminosos»?","o":["Los residuos de construcción","Los residuos de podas","Todos los residuos de mercados","Los generados en los hogares con características especiales de volumen, peso o tamaño que dificultan su recogida por el sistema ordinario"],"a":3,"r":"Art. 3.1.aa"},{"id":78,"b":"Ordenanza municipal de limpieza","q":"La «reutilización» es:","o":["Transformar residuos en nuevos productos","Cualquier operación mediante la cual productos o componentes que no sean residuos se utilizan de nuevo con la misma finalidad para la que fueron concebidos","Eliminar residuos de forma controlada","Preparar residuos para su reciclado"],"a":1,"r":"Art. 3.1.dd"},{"id":79,"b":"Ordenanza municipal de limpieza","q":"El «reciclado» NO incluye:","o":["El reciclado con finalidad distinta a la original","La transformación del material orgánico","La transformación de residuos en nuevos productos","La valorización energética ni la transformación en materiales para usar como combustibles o rellenos"],"a":3,"r":"Art. 3.1.gg"},{"id":80,"b":"Ordenanza municipal de limpieza","q":"¿Qué se denomina «material bioestabilizado»?","o":["El material orgánico obtenido de plantas de tratamiento mecánico biológico de residuos mezclados, que no se considera compost","El compost doméstico","La enmienda orgánica de recogida separada","El compost de poda"],"a":0,"r":"Art. 3.1.ll"},{"id":81,"b":"Ordenanza municipal de limpieza","q":"Los «residuos sanitarios grupo II» se rigen por:","o":["El Real Decreto 1481/2001","El art. 5 del Decreto 136/1996, de ordenación de la gestión de residuos sanitarios en las Illes Balears","La Orden MAM/304/2002","La Ley 22/2011"],"a":1,"r":"Art. 3.1.nn"},{"id":82,"b":"Ordenanza municipal de limpieza","q":"Las «bolsas de plástico ligeras» tienen un grosor:","o":["Superior a 50 micras","Entre 50 y 100 micras","Inferior a 15 micras","Inferior a 50 micras y superior a 15 micras"],"a":3,"r":"Art. 3.1.uu"},{"id":83,"b":"Ordenanza municipal de limpieza","q":"Según el art. 4, la competencia de la prestación del servicio de limpieza está:","o":["Delegada en el Consell de Mallorca","Compartida con las comunidades de propietarios","Reservada al Ayuntamiento, gestionada a través de cualquiera de las formas previstas en la normativa de régimen local","Reservada a EMAYA por ley"],"a":2,"r":"Art. 4"},{"id":84,"b":"Ordenanza municipal de limpieza","q":"No tendrá la consideración de suciedad de limpieza viaria la producida a consecuencia de:","o":["Residuos depositados fuera de contenedores","Actos vandálicos en mobiliario urbano","Vertidos de aceites de vehículos","Accidentes u otras circunstancias imprevisibles o inevitables, de fuerza mayor"],"a":3,"r":"Art. 6.2"},{"id":85,"b":"Ordenanza municipal de limpieza","q":"Las actividades mercantiles o recreativas en vía pública que ocasionen un ensuciamiento superior al habitual:","o":["Solo se limpian si son nocturnas","Siempre son suciedad de limpieza viaria","Las limpia siempre EMAYA","No son suciedad de limpieza viaria, salvo las organizadas por el Ayuntamiento"],"a":3,"r":"Art. 6.2.b"},{"id":86,"b":"Ordenanza municipal de limpieza","q":"La limp cativa de residuos van a:","o":["Vidrio","Envases ligeros","Resto","Papel y cartón"],"a":2,"r":"Anexo II"},{"id":176,"b":"Protocolo de acoso","q":"¿Cuál es el objeto principal del Protocolo de prevención ante el acoso psicológico, sexual o por razón de sexo?","o":["Regular la mediación en conflictos económicos","Establecer los turnos de trabajo","Establecer políticas que contribuyan a entornos laborales libres de acoso y garantizar procedimientos adecuados para tratar y corregir el problema","Fijar el régimen disciplinario de la plantilla"],"a":2,"r":"1. Objeto"},{"id":177,"b":"Protocolo de acoso","q":"¿A quién se aplica el protocolo?","o":["Solo al personal de Calidad Urbana","Solo al personal fijo","A toda la plantilla, independientemente de su situación contractual y categoría profesional","Solo a los mandos intermedios"],"a":2,"r":"2. Ámbito de aplicación"},{"id":178,"b":"Protocolo de acoso","q":"¿Cómo se dará a conocer el protocolo al personal?","o":["Mediante su divulgación e información, así como formación en prevención de riesgos psicosociales y del acoso","Solo en el tablón de anuncios","Solo mediante correo electrónico","Solo en la entrevista de acogida"],"a":0,"r":"2. Ámbito de aplicación"},{"id":179,"b":"Protocolo de acoso","q":"La expresión «acoso» alcanza toda conducta que, con cierta reiteración y sistematicidad, pueda considerarse:","o":["Disciplinaria","Exclusivamente física","Ofensiva, humillante, violenta o intimidatoria, en el lugar de trabajo o con ocasión de éste","Informal"],"a":2,"r":"3. Objetivo y conceptos básicos"},{"id":180,"b":"Protocolo de acoso","q":"El acoso psicológico es la exposición a conductas de violencia psicológica dirigidas de forma reiterada y prolongada hacia una o más personas por parte de otra u otras que actúan desde:","o":["Una posición de igualdad","Una posición de poder (no necesariamente jerárquica)","Cualquier posición con un mínimo de tres personas","Una posición jerárquica superior"],"a":1,"r":"3.1.1 Acoso psicológico"},{"id":181,"b":"Protocolo de acoso","q":"¿Qué dos circunstancias deben darse para hablar de acoso psicológico o laboral?","o":["Que se produzca fuera del trabajo y sea intencionado","Que sea de forma sistemática (p. ej. una vez por semana) y que se prolongue en el tiempo (más de seis meses)","Que sea puntual y grave","Que haya testigos y denuncia previa"],"a":1,"r":"3.1.1 Acoso psicológico"},{"id":182,"b":"Protocolo de acoso","q":"¿Qué intencionalidad suele perseguirse en el acoso psicológico?","o":["Que la persona abandone su puesto de trabajo","Aumentar la productividad","Reorganizar equipos","Mejorar el rendimiento"],"a":0,"r":"3.1.1 Acoso psicológico"},{"id":183,"b":"Protocolo de acoso","q":"El «terror telefónico» llevado a cabo por la persona hostigadora es un ejemplo de:","o":["Ataque con medidas organizacionales","Ataque a las actitudes de la víctima","Ataque a la vida privada de la víctima","Violencia física"],"a":2,"r":"3.1.1 Acoso psicológico"},{"id":184,"b":"Protocolo de acoso","q":"Amenazas de violencia física, uso de violencia menor, gritos o insultos son ejemplos de:","o":["Ataques a la vida privada","Ataques con medidas organizacionales","Rumores","Violencia física o agresiones verbales"],"a":3,"r":"3.1.1 Acoso psicológico"},{"id":185,"b":"Protocolo de acoso","q":"Los ataques a las creencias políticas o religiosas y las mofas a la nacionalidad son ejemplos de:","o":["Medidas organizacionales","Ataques a la vida privada","Ataques a las actitudes de la víctima","Violencia física"],"a":2,"r":"3.1.1 Acoso psicológico"},{"id":186,"b":"Protocolo de acoso","q":"Hablar mal de la persona a su espalda y difundir rumores falsos sobre su trabajo o vida privada son ejemplos de:","o":["Ataques a las actitudes","Rumores","Violencia física","Ataques con medidas organizacionales"],"a":1,"r":"3.1.1 Acoso psicológico"},{"id":187,"b":"Protocolo de acoso","q":"¿A qué norma técnica se remite el protocolo para definir qué NO es acoso?","o":["NTP 700","NTP 891","NTP 854 «Acoso psicológico en el trabajo: definición» del INSHT","NTP 892"],"a":2,"r":"3.1.1 Qué NO es acoso"},{"id":188,"b":"Protocolo de acoso","q":"¿Cuál de estas situaciones NO es mobbing según el protocolo?","o":["Reprender reiteradamente a una persona delante de otras","Atacar sistemáticamente a una persona","Las críticas constructivas, explícitas y justificadas","Destruir la reputación de una persona mediante calumnias"],"a":2,"r":"3.1.1 Qué NO es acoso"},{"id":189,"b":"Protocolo de acoso","q":"El estilo de mando autoritario por parte de los superiores:","o":["Es acoso si el mando es hombre","No constituye por sí mismo acoso, pero debe tratarse en el marco de la prevención de riesgos psicosociales","Es siempre acoso","Es siempre una falta muy grave"],"a":1,"r":"3.1.1 Qué NO es acoso"},{"id":190,"b":"Protocolo de acoso","q":"El comportamiento arbitrario o excesivamente autoritario realizado a la colectividad en general:","o":["Es acoso sexual","No constituye acoso psicológico","Es acoso por razón de sexo","Es acoso psicológico"],"a":1,"r":"3.1.1 Qué NO es acoso"},{"id":191,"b":"Protocolo de acoso","q":"El acoso sexual se define como:","o":["Cualquier comportamiento verbal o físico, de naturaleza sexual, que tenga el propósito o produzca el efecto de atentar contra la dignidad de una persona, en particular cuando se crea un entorno intimidatorio, degradante u ofensivo","Cualquier comportamiento físico en el trabajo","Cualquier comentario sobre la apariencia","Solo el contacto físico no deseado"],"a":0,"r":"3.1.2 Acoso sexual"},{"id":192,"b":"Protocolo de acoso","q":"Las insinuaciones sexuales molestas, proposiciones o presión para la actividad sexual son:","o":["Conducta verbal de naturaleza sexual","Acoso psicológico","Conducta física de naturaleza sexual","Conducta no verbal de naturaleza sexual"],"a":0,"r":"3.1.2 Acoso sexual"},{"id":193,"b":"Protocolo de acoso","q":"La exhibición de fotos sexualmente sugestivas o pornográficas, miradas o gestos lascivos y silbidos son:","o":["Conducta no verbal de naturaleza sexual","Conducta física de naturaleza sexual","Conducta verbal de naturaleza sexual","Acoso psicológico"],"a":0,"r":"3.1.2 Acoso sexual"},{"id":194,"b":"Protocolo de acoso","q":"Para considerar una conducta como acoso sexual, siempre estamos ante una conducta:","o":["Con testigos","De naturaleza claramente sexual, no deseada por la víctima, sin reciprocidad e impuesta","Reiterada durante seis meses","Realizada por un superior"],"a":1,"r":"3.1.2 Acoso sexual"},{"id":195,"b":"Protocolo de acoso","q":"El acoso por razón de sexo es cualquier comportamiento realizado en función del sexo u orientación sexual de una persona con el propósito o efecto de:","o":["Mejorar el rendimiento","Reasignar su puesto","Atentar contra su dignidad y crear un entorno intimidatorio, degradante u ofensivo","Discriminar en el acceso al empleo"],"a":2,"r":"3.1.3 Acoso por razón de sexo"},{"id":196,"b":"Protocolo de acoso","q":"¿Cuál es una conducta calificada de acoso por razón de sexo?","o":["Asignar tareas sin sentido o imposibles de lograr (plazos irracionales) a una persona en función de su sexo","Dar un trato cordial","Aplicar el mismo criterio de asignación de tareas a todas las personas","Realizar evaluaciones de desempeño"],"a":0,"r":"3.1.3 Acoso por razón de sexo"},{"id":197,"b":"Protocolo de acoso","q":"Según el anexo, el acoso por razón de sexo en el trabajo debe producirse en el ámbito de la organización o como consecuencia de una relación de trabajo, tener su fundamento en la constatación del sexo de la persona perjudicada y:","o":["Durar al menos seis meses","Haber sido denunciado previamente","Revestir suficiente gravedad en función de su intensidad, reiteración o efectos sobre la salud","Haber sido cometido por un superior"],"a":2,"r":"Anexo: Acoso por razón de sexo"},{"id":198,"b":"Protocolo de acoso","q":"Las situaciones de violencia laboral se caracterizan por ser:","o":["Procesos graduales que van gestándose a lo largo del tiempo, por lo que se debe actuar de forma preventiva","Hechos puntuales e imprevisibles","Siempre físicos","Siempre intencionados"],"a":0,"r":"4. Medidas preventivas"},{"id":199,"b":"Protocolo de acoso","q":"¿Cuál de las siguientes es una medida preventiva del acoso?","o":["Sanción preventiva","Reducción de plantilla","Formación en prevención del acoso a todo el personal y en habilidades directivas a mandos intermedios","Rotación obligatoria de puestos"],"a":2,"r":"4. Medidas preventivas"},{"id":200,"b":"Protocolo de acoso","q":"La información como medida preventiva consiste en:","o":["Informar solo a los mandos","Informar solo a la persona afectada","Divulgar material (carteles, folletos, web) con la información necesaria y suficiente para la prevención del acoso","Publicar los casos resueltos"],"a":2,"r":"4. Medidas preventivas"},{"id":201,"b":"Protocolo de acoso","q":"¿Qué es el PAE?","o":["El Plan de Acción Estratégico","El Programa de Atención al Empleado, para atender a cualquier persona trabajadora que perciba malestar de origen laboral, conflicto o cualquier aspecto que le afecte en el ámbito laboral","El Protocolo de Actuación Específico","El Procedimiento de Actuación Externo"],"a":1,"r":"4. Medidas preventivas"},{"id":202,"b":"Protocolo de acoso","q":"Las investigaciones de casos puntuales se realizan:","o":["Para aquellas personas que lo soliciten, investigando causas y posibles soluciones","Solo por la comisión","De oficio en todos los casos","Solo si hay denuncia formal"],"a":0,"r":"4. Medidas preventivas"},{"id":203,"b":"Protocolo de acoso","q":"Los procedimientos de solución autónoma de conflictos de violencia laboral se basan en las notas técnicas de prevención:","o":["891 y 854","891 y 892","854 y 855","700 y 701"],"a":1,"r":"4. Medidas preventivas"},{"id":204,"b":"Protocolo de acoso","q":"¿Con qué servicio solicita cita la persona trabajadora que percibe acoso en la fase previa mediante PAE?","o":["Con RRHH","Con el Servicio de Inspección","Con el comité de empresa","Con el servicio de psicosociología"],"a":3,"r":"4. Fase previa mediante PAE"},{"id":205,"b":"Protocolo de acoso","q":"En la fase previa mediante PAE, si hay acuerdo y conciliación entre ambas partes se elabora:","o":["Un informe de resultados y acuerdos alcanzados y se hace seguimiento","Una sanción","Una denuncia formal","Un archivo definitivo"],"a":0,"r":"4. Fase previa mediante PAE"},{"id":206,"b":"Protocolo de acoso","q":"¿Dónde está ubicado el servicio de psicosociología?","o":["En la calle Joan Maragall","En Son Reus","En Son Castelló","En Son Pacs"],"a":3,"r":"5. Declaración de principios"},{"id":207,"b":"Protocolo de acoso","q":"¿Quién es la persona designada en EMAYA para la gestión de los casos de acoso?","o":["El/la gerente","El/la delegado/a sindical","El/la jefe/a de RRHH","El/la psicólogo/a del servicio de prevención"],"a":3,"r":"6. Proceso o protocolo de actuación"},{"id":208,"b":"Protocolo de acoso","q":"¿Cómo será difundido el protocolo al personal?","o":["Solo por correo postal","Mediante la web de EMAYA, los delegados de prevención o adjunto a la nómina","Solo en la intranet","Solo mediante carteles"],"a":1,"r":"6. Proceso o protocolo de actuación"},{"id":209,"b":"Protocolo de acoso","q":"La vía informal de actuación sirve para resolver el caso:","o":["Normalmente mediante diálogo y/o mediación, y se incluye en el PAE; no son casos de acoso pero sí conflictos que deben tratarse","Con intervención de la comisión anti acoso","Con sanción disciplinaria","Mediante una investigación formal"],"a":0,"r":"6. Proceso o protocolo de actuación"},{"id":210,"b":"Protocolo de acoso","q":"La vía formal u oficial exige:","o":["La intervención e implicación de más personas, áreas o departamentos en el proceso de actuación","La mediación voluntaria","Solo un diálogo entre las partes","Solo la intervención del servicio de psicosociología"],"a":0,"r":"6. Proceso o protocolo de actuación"},{"id":211,"b":"Protocolo de acoso","q":"Durante todo el proceso, la persona que denuncie podrá estar:","o":["Acompañada de una persona de su confianza","Representada por un abogado obligatoriamente","Acompañada por la persona denunciada","Sola"],"a":0,"r":"6.b Fases"},{"id":212,"b":"Protocolo de acoso","q":"¿Quién puede denunciar casos de presunto acoso además de la persona afectada?","o":["Cualquier persona externa","Solo RRHH","La representación legal de las personas trabajadoras, las personas delegadas de prevención y cualquier persona trabajadora que tenga conocimiento de los hechos","Solo la representación legal"],"a":2,"r":"6.1 Fase de iniciación"},{"id":213,"b":"Protocolo de acoso","q":"¿Qué sucede si el servicio de psicosociología tiene conocimiento de un posible caso de acoso?","o":["Lo comunicará a la plantilla","Lo archivará","Contactará con la persona supuestamente acosada para informarla sobre el protocolo","Iniciará la sanción"],"a":2,"r":"6.1 Fase de iniciación"},{"id":214,"b":"Protocolo de acoso","q":"El escrito de denuncia debe contener, al menos:","o":["Solo la firma de la persona","Solo descripción de los hechos","Solo nombre y apellidos","Identificación y firma de la persona denunciante, descripción de los hechos y naturaleza del acoso, personas presuntamente acosadoras, información para la investigación, testigos, y si se gestiona mediante la comisión o no"],"a":3,"r":"6.1 Fase de iniciación"},{"id":215,"b":"Protocolo de acoso","q":"Una vez la denuncia está en poder de la persona mediadora, esta mantendrá una entrevista con la presunta víctima en un plazo máximo de:","o":["15 días laborales","10 días naturales","7 días laborables siguientes a su recepción","3 días laborables"],"a":2,"r":"6.1 Fase de iniciación"},{"id":216,"b":"Protocolo de acoso","q":"En la entrevista, la persona mediadora solicitará a la persona denunciante:","o":["Que firme un acuerdo de confidencialidad con la persona denunciada","Que renuncie a acciones legales","El consentimiento expreso y por escrito para poder acceder a cuanta in let cfg={blocks:new Set(BL),n:20,mode:"examen"},S=null;
const app=document.getElementById("app");
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function home(){
  const pool=Q.filter(x=>cfg.blocks.has(x.b));
  app.innerHTML=`<h2 class="h4 fw-bold">Configuración del test</h2>
  <p class="mut">${Q.length} preguntas · acierto +${PA} · error −${PE} · en blanco 0</p>
  <div class="card"><h2>Bloques</h2><div class="chips">${BL.map(b=>`<button class="chip ${cfg.blocks.has(b)?"on":""}" data-b="${esc(b)}">${esc(b)} (${Q.filter(x=>x.b===b).length})</button>`).join("")}</div></div>
  <div class="card"><h2>Nº de preguntas</h2><div class="chips">${[10,20,40,60,0].map(n=>`<button class="chip ${cfg.n===n?"on":""}" data-n="${n}">${n||"Todas"}</button>`).join("")}</div>
  <h2>Modo</h2><label><input type="radio" name="m" value="examen" ${cfg.mode==="examen"?"checked":""}> Examen (corrección al final)</label>
  <label><input type="radio" name="m" value="practica" ${cfg.mode==="practica"?"checked":""}> Práctica (corrección inmediata)</label></div>
  <button class="btn" id="go" ${pool.length?"":"disabled"}>Empezar (${cfg.n?Math.min(cfg.n,pool.length):pool.length})</button>
  ${fails.size?`<button class="btn sec" id="rf">Repasar mis fallos (${fails.size})</button><button class="btn sec" id="cf">Borrar fallos</button>`:""}`;
  app.querySelectorAll("[data-b]").forEach(e=>e.onclick=()=>{const b=e.dataset.b;cfg.blocks.has(b)?cfg.blocks.delete(b):cfg.blocks.add(b);home()});
  app.querySelectorAll("[data-n]").forEach(e=>e.onclick=()=>{cfg.n=+e.dataset.n;home()});
  app.querySelectorAll("[name=m]").forEach(e=>e.onchange=()=>{cfg.mode=e.value});
  document.getElementById("go").onclick=()=>start(shuffle(pool).slice(0,cfg.n||pool.length),cfg.mode);
  const rf=document.getElementById("rf");if(rf){rf.onclick=()=>start(shuffle(Q.filter(x=>fails.has(x.id))),cfg.mode);document.getElementById("cf").onclick=()=>{fails.clear();saveFails();home()}}
}
function start(qs,mode){S={qs,mode,i:0,ans:{},done:{}};show()}
function show(){
  const q=S.qs[S.i],a=S.ans[S.i],fin=S.done[S.i],prac=S.mode==="practica",N=S.qs.length;
  const cls=k=>{if(prac&&fin){if(k===q.a)return"ok";if(k===a)return"ko"}return a===k?"sel":""};
  app.innerHTML=`<div class="row"><span class="mut">Pregunta ${S.i+1} de ${N} · ${esc(q.b)}</span><button class="btn sec" id="ex">Salir</button></div>
  <div class="bar"><i style="width:${(S.i+1)/N*100}%"></i></div>
  <div class="card"><p><b>${esc(q.q)}</b></p>${q.o.map((t,k)=>`<button class="opt ${cls(k)}" data-k="${k}"><b>${L[k]}</b><span>${esc(t)}</span></button>`).join("")}
  ${prac&&fin?`<div class="fb" style="background:${a===q.a?"var(--okbg)":"var(--kobg)"}">${a===q.a?"✔ Correcto":"✘ Incorrecto · correcta: "+L[q.a]}<br><span class="mut">Fuente: ${esc(q.r)}</span></div>`:""}</div>
  <div class="row"><button class="btn sec" id="pv" ${S.i?"":"disabled"}>Anterior</button>
  ${S.i<N-1?`<button class="btn ${!prac&&a===undefined?"skip":""}" id="nx">${prac||a!==undefined?"Siguiente":"Saltar"}</button>`:`<button class="btn" id="fn">Finalizar</button>`}</div>`;
  document.getElementById("ex").onclick=()=>{if(confirm("¿Salir del test?"))home()};
  app.querySelectorAll(".opt").forEach(e=>e.onclick=()=>{
    const k=+e.dataset.k;
    if(prac){if(fin)return;S.ans[S.i]=k;S.done[S.i]=true}
    else{if(S.ans[S.i]===k)delete S.ans[S.i];else S.ans[S.i]=k}
    show()});
  const pv=document.getElementById("pv");pv.onclick=()=>{S.i--;show()};
  const nx=document.getElementById("nx");if(nx)nx.onclick=()=>{S.i++;show();scrollTo(0,0)};
  const fn=document.getElementById("fn");if(fn)fn.onclick=()=>{const u=S.qs.length-Object.keys(S.ans).length;if(!u||confirm(u+" sin responder (puntúan 0). ¿Finalizar?"))result()};
}
function result(){
  const N=S.qs.length;let ok=0,ko=0;const per={};
  S.qs.forEach((q,i)=>{const a=S.ans[i],p=per[q.b]=per[q.b]||{n:0,ok:0,ko:0};p.n++;
    if(a===undefined)return;if(a===q.a){ok++;p.ok++;fails.delete(q.id)}else{ko++;p.ko++;fails.add(q.id)}});
  saveFails();
  const sc=ok*PA-ko*PE,n10=Math.max(0,sc/(N*PA)*10);
  const rev=S.qs.map((q,i)=>({q,a:S.ans[i]})).filter(x=>x.a!==x.q.a);
  app.innerHTML=`<h1>Resultado</h1><div class="card"><div class="big">${n10.toFixed(2)} <span class="mut" style="font-size:1rem">/ 10</span></div>
  <p>Puntuación: <b>${sc.toFixed(2)}</b> de ${(N*PA).toFixed(1)} · Aciertos ${ok} · Fallos ${ko} · En blanco ${N-ok-ko}</p></div>
  <div class="card"><table><tr><th>Bloque</th><th>Preg.</th><th>✔</th><th>✘</th></tr>${Object.entries(per).map(([b,p])=>`<tr><td>${esc(b)}</td><td>${p.n}</td><td>${p.ok}</td><td>${p.ko}</td></tr>`).join("")}</table></div>
  <button class="btn" id="rt">Repetir fallos y blancos</button><button class="btn sec" id="hm">Inicio</button>
  <h2>Revisión (${rev.length})</h2>${rev.map(({q,a})=>`<div class="rev ${a===undefined?"blank":""}"><b>${esc(q.q)}</b><br>
  <span style="color:var(--ko)">${a===undefined?"En blanco":"Tu respuesta: "+L[a]+") "+esc(q.o[a])}</span><br>
  <span style="color:var(--ok)">Correcta: ${L[q.a]}) ${esc(q.o[q.a])}</span><br><span class="mut">Fuente: ${esc(q.r)}</span></div>`).join("")||"<p>¡Sin fallos!</p>"}`;
  document.getElementById("hm").onclick=home;
  document.getElementById("rt").onclick=()=>rev.length?start(shuffle(rev.map(x=>x.q)),S.mode):home();
  scrollTo(0,0);
}
home();
</script>
</body>
</html>
