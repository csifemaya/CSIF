.big{font-size:2.4rem;font-weight:800;color:var(--pr);margin:0}
.chk{display:flex;align-items:center;gap:8px;margin:12px 0;font-weight:normal}.chk input{width:20px;height:20px}
.rv{border-top:1px solid #dee2e6;padding:10px 0}.rv .s{font-weight:bold}

.nav{display:flex;gap:8px;margin-top:12px}.nav>*{flex:1}

const Q=[{"id": 1, "t": "1. Código Ético", "r": "Valores", "q": "¿Cuál de los siguientes NO es uno de los cinco valores de EMAYA?", "o": ["Sostenibilidad", "Servicio", "Competitividad", "Integridad"], "c": 2, "e": "Los cinco: servicio, integridad, innovación, sostenibilidad y personas."}, {"id": 2, "t": "1. Código Ético", "r": "Nosotros", "q": "¿Qué criterio adopta EMAYA frente al soborno y la corrupción?", "o": ["Tolerancia limitada", "Sanción económica automática", "Autorregulación", "Tolerancia cero"], "c": 3, "e": "Debe comunicarse cuanto antes cualquier hecho o indicio."}, {"id": 3, "t": "1. Código Ético", "r": "Código ético", "q": "¿Tiene el Código Ético una finalidad sancionadora?", "o": ["Sí, es su finalidad principal", "No: su función es prevenir, corregir o reeducar", "Solo para el Consejo de Administración", "Solo para directivos"], "c": 1, "e": "El objetivo es la mejora continua."}, {"id": 4, "t": "1. Código Ético", "r": "Actualización", "q": "¿Quién debe aprobar cualquier modificación del Código?", "o": ["El Ayuntamiento de Palma", "La Dirección de RRHH", "El Consejo de Administración", "El Comité de Ética"], "c": 2, "e": "El Comité de Ética revisa y actualiza periódicamente."}, {"id": 5, "t": "1. Código Ético", "r": "Canal ético", "q": "¿Qué permite el canal ético?", "o": ["Solo consultas laborales", "Comunicar dudas, sugerencias o irregularidades, incluso de forma anónima", "Solo denuncias identificadas", "Reclamaciones de clientes"], "c": 1, "e": "Contacto: canaletic@emaya.es."}, {"id": 6, "t": "1. Código Ético", "r": "Canal ético", "q": "¿Qué dice el Código sobre represalias a quien usa el canal ético de buena fe?", "o": ["Se valoran caso por caso", "Solo se prohíben para el personal fijo", "Están expresamente prohibidas", "Se admiten si hay perjuicio a la empresa"], "c": 2, "e": "Las comunicaciones son confidenciales."}, {"id": 7, "t": "1. Código Ético", "r": "Conflictos de interés", "q": "Ante un conflicto de interés, ¿qué debe hacer el personal?", "o": ["Intervenir con transparencia", "Esperar a que la Dirección lo detecte", "Solo comunicarlo a un compañero", "Comunicarlo y abstenerse de intervenir en la decisión"], "c": 3, "e": ""}, {"id": 8, "t": "1. Código Ético", "r": "Misión", "q": "En la misión, ¿qué se prima en las operaciones?", "o": ["La rentabilidad financiera", "La seguridad de las personas y las instalaciones", "La reducción de plantilla", "La rapidez de ejecución"], "c": 1, "e": "Junto a la satisfacción del usuario y el cuidado del medioambiente."}, {"id": 9, "t": "1. Código Ético", "r": "Misión", "q": "¿Cuál NO es un área de actividad que cita la misión?", "o": ["Abastecimiento de agua y saneamiento", "Limpieza viaria y recogida selectiva", "Gestión de transporte público de viajeros", "Energía renovable y movilidad sostenible"], "c": 2, "e": ""}, {"id": 10, "t": "1. Código Ético", "r": "Datos personales", "q": "¿Qué datos personales se obtienen?", "o": ["Todos los disponibles", "Solo los de clientes", "Los que decida cada departamento", "Únicamente los necesarios para la finalidad perseguida"], "c": 3, "e": "Acceso solo del personal autorizado."}, {"id": 11, "t": "1. Código Ético", "r": "Actualización", "q": "¿Qué puede ocurrir ante un incumplimiento del Código?", "o": ["Nada, es voluntario", "Sanciones laborales según el convenio colectivo o el Estatuto de los Trabajadores", "Solo una amonestación verbal", "Expulsión automática"], "c": 1, "e": ""}, {"id": 12, "t": "1. Código Ético", "r": "Introducción", "q": "¿A quién se aplica el Código?", "o": ["Solo al Consejo de Administración", "Solo a la plantilla fija", "Solo a la Dirección", "A todas las personas que integran EMAYA o colaboran con ella"], "c": 3, "e": "Incluye Dirección y Consejo."}, {"id": 13, "t": "1. Código Ético", "r": "Entorno de trabajo", "q": "¿Qué queda expresamente prohibido en el entorno de trabajo?", "o": ["Los cambios de turno", "El trabajo en equipo", "Abuso de autoridad, acoso y discriminación", "Las reuniones informales"], "c": 2, "e": ""}, {"id": 14, "t": "1. Código Ético", "r": "Derechos laborales", "q": "¿Qué derechos colectivos respeta EMAYA según el Código?", "o": ["Solo negociación colectiva", "Ninguno específico", "Sindicación, asociación y negociación colectiva", "Solo huelga"], "c": 2, "e": ""}, {"id": 15, "t": "1. Código Ético", "r": "Proveedores", "q": "¿En qué norma se inspira la contratación con proveedores?", "o": ["El Estatuto de los Trabajadores", "La libre negociación", "El Código Civil únicamente", "La norma de contratos del sector público"], "c": 3, "e": "Se incentiva una política de compra sostenible."}, {"id": 16, "t": "2. LPRL arts. 14-19", "r": "Art. 14.5", "q": "¿Sobre quién puede recaer el coste de las medidas de seguridad y salud?", "o": ["En modo alguno sobre los trabajadores", "Sobre el trabajador si es voluntario", "A partes iguales", "Sobre los representantes"], "c": 0, "e": ""}, {"id": 17, "t": "2. LPRL arts. 14-19", "r": "Art. 14.1", "q": "El deber de protección del empresario, ¿se extiende a las Administraciones públicas respecto de su personal?", "o": ["Sí, también es un deber de las Administraciones", "Solo en la Administración del Estado", "No", "Solo en las empresas públicas"], "c": 0, "e": ""}, {"id": 18, "t": "2. LPRL arts. 14-19", "r": "Art. 15.1.h", "q": "Según los principios de la acción preventiva, ¿qué se antepone a la protección individual?", "o": ["La vigilancia de la salud", "La protección colectiva", "La formación", "El EPI"], "c": 1, "e": ""}, {"id": 19, "t": "2. LPRL arts. 14-19", "r": "Art. 15.1", "q": "¿Cuál NO es un principio de la acción preventiva?", "o": ["Sustituir lo peligroso por lo que entrañe poco peligro", "Priorizar la protección individual sobre la colectiva", "Combatir los riesgos en su origen", "Evitar los riesgos"], "c": 1, "e": ""}, {"id": 20, "t": "2. LPRL arts. 14-19", "r": "Art. 15.4", "q": "¿Qué debe prever la efectividad de las medidas preventivas?", "o": ["Solo los riesgos externos", "Cualquier imprudencia temeraria", "Solo los fallos técnicos", "Las distracciones o imprudencias no temerarias del trabajador"], "c": 3, "e": ""}, {"id": 21, "t": "2. LPRL arts. 14-19", "r": "Art. 15.3", "q": "¿Quién puede acceder a las zonas de riesgo grave y específico?", "o": ["Solo los trabajadores con información suficiente y adecuada", "Solo los mandos", "Todos los trabajadores", "Quienes tengan EPI"], "c": 0, "e": ""}, {"id": 22, "t": "2. LPRL arts. 14-19", "r": "Art. 16.2", "q": "¿Cuáles son los instrumentos esenciales del plan de prevención?", "o": ["La vigilancia de la salud y la formación", "La evaluación de riesgos y la planificación de la actividad preventiva", "El comité y el delegado", "Las inspecciones y las sanciones"], "c": 1, "e": ""}, {"id": 23, "t": "2. LPRL arts. 14-19", "r": "Art. 16.3", "q": "Si se produce un daño para la salud de los trabajadores, ¿qué debe hacer el empresario?", "o": ["Nada, si es leve", "Esperar a la Inspección de Trabajo", "Cambiar al trabajador de puesto", "Investigar las causas"], "c": 3, "e": ""}, {"id": 24, "t": "2. LPRL arts. 14-19", "r": "Art. 16.2.a", "q": "¿Cuándo se actualiza la evaluación de riesgos?", "o": ["Solo si lo pide la Inspección", "Cuando cambian las condiciones de trabajo", "Nunca, es inicial", "Cada 10 años"], "c": 1, "e": "También se revisa con ocasión de los daños para la salud."}, {"id": 25, "t": "2. LPRL arts. 14-19", "r": "Art. 17.2", "q": "¿Cuándo deben utilizarse los EPI?", "o": ["Solo si el trabajador lo pide", "Cuando los riesgos no se puedan evitar o limitar suficientemente por medios colectivos u organizativos", "Siempre", "Solo en obras"], "c": 1, "e": ""}, {"id": 26, "t": "2. LPRL arts. 14-19", "r": "Art. 17.1", "q": "Si un equipo de trabajo presenta riesgo específico, ¿quién hace reparación y mantenimiento?", "o": ["Un proveedor externo siempre", "Cualquier trabajador", "El usuario del equipo", "Trabajadores específicamente capacitados"], "c": 3, "e": ""}, {"id": 27, "t": "2. LPRL arts. 14-19", "r": "Art. 18.1 ro?", "o": ["Un mes", "Cinco días hábiles", "Quince días naturales", "48 horas"], "c": 2, "e": ""}, {"id": 112, "t": "7. Reglamento agua", "r": "Art. 22", "q": "¿En cuál de estos casos puede ser inmediata la suspensión?", "o": ["No facilitar la lectura", "Fraude de agua", "Impago", "Cambio de abonado"], "c": 1, "e": "Inmediata en 1, 4, 5, 12, 13 y 14."}, {"id": 113, "t": "7. Reglamento agua", "r": "Art. 24", "q": "¿Cuándo no puede suspenderse el suministro (salvo suspensión inmediata)?", "o": ["En verano", "En festivos y vísperas", "Por la noche", "Los lunes"], "c": 1, "e": ""}, {"id": 114, "t": "7. Reglamento agua", "r": "Art. 25", "q": "¿Cuándo se restablece el servicio tras subsanar la causa?", "o": ["El mismo día o el siguiente día hábil", "En un mes", "En una semana", "En 72 horas"], "c": 0, "e": ""}, {"id": 115, "t": "7. Reglamento agua", "r": "Art. 26", "q": "¿Cuándo puede llegarse al corte de la acometida?", "o": ["Tras una factura impagada", "Al tercer día", "Nunca", "Si la suspensión supera seis meses o las medidas menos rigurosas son ineficaces"], "c": 3, "e": ""}, {"id": 116, "t": "7. Reglamento agua", "r": "Art. 28", "q": "¿Tras cuánto tiempo de suspensión puede resolverse el contrato?", "o": ["Seis meses", "Tres meses", "Un año", "Un mes"], "c": 1, "e": ""}, {"id": 117, "t": "7. Reglamento agua", "r": "Art. 31", "q": "¿Qué tolerancia se admite en presión y caudal?", "o": ["Más o menos un 2%", "Un 5%", "Más o menos un 20%", "Un 50%"], "c": 2, "e": ""}, {"id": 118, "t": "7. Reglamento agua", "r": "Art. 32", "q": "¿Qué preaviso mínimo requieren los cortes previsibles?", "o": ["72 horas", "24 horas", "2 horas", "Una semana"], "c": 1, "e": ""}, {"id": 119, "t": "7. Reglamento agua", "r": "Art. 36", "q": "¿Cuánto puede durar como máximo el periodo de lectura de contadores?", "o": ["Un año", "Dos años", "Seis meses", "Un mes"], "c": 2, "e": "El abonado tiene cinco días hábiles para facilitar la lectura si no pudo hacerse."}, {"id": 120, "t": "7. Reglamento ag  60 €", "90 a 300 €", "901,01 a 1.803 €"], "c": 2, "e": "Grave: 300,01 a 900 €. Muy grave: 901,01 a 1.803 €."}, {"id": 136, "t": "8. Reglamento alcantarillado", "r": "Art. 29", "q": "Multa máxima de una infracción muy grave", "o": ["3.000 €", "6.010,12 €", "900 €", "1.803 €"], "c": 3, "e": ""}, {"id": 137, "t": "8. Reglamento alcantarillado", "r": "Art. 10", "q": "Las prolongaciones de red fuera de la planificación de la gestora corren a cargo de…", "o": ["El Ayuntamiento", "EMAYA", "El solicitante", "Todos los abonados"], "c": 2, "e": "Pasan a titularidad municipal."}, {"id": 138, "t": "8. Reglamento alcantarillado", "r": "Art. 11", "q": "Como regla general, ¿cuántas acometidas hay por edificio?", "o": ["Dos", "Una", "Una por planta", "Las que se quieran"], "c": 1, "e": ""}, {"id": 139, "t": "8. Reglamento alcantarillado", "r": "Art. 17", "q": "¿Hasta dónde mantiene EMAYA la red a su cargo?", "o": ["Hasta el contador", "Hasta la fachada", "Hasta el inodoro", "Hasta la conexión con la instalación interior (generalmente el pozo de bloqueo)"], "c": 3, "e": ""}, {"id": 140, "t": "8. Reglamento alcantarillado", "r": "Art. 18", "q": "¿Quién aprueba las tarifas del servicio?", "o": ["El Govern", "EMAYA", "Los abonados", "El Ayuntamiento"], "c": 3, "e": ""}, {"id": 141, "t": "8. Reglamento alcantarillado", "r": "Disp. derogatoria", "q": "¿Qué ordenanza deroga el reglamento?", "o": ["La de 2004", "La de limpieza", "Ninguna", "La ordenanza sobre uso del alcantarillado sanitario de 1986"], "c": 3, "e": ""}, {"id": 142, "t": "8. Reglamento alcantarillado", "r": "Art. 2", "q": "¿Qué reglamento se aplica supletoriamente para estimar vertidos, tarifas y facturación?", "o": ["El de abastecimiento de agua", "El de limpieza", "El de animales", "El de publicidad"], "c": 0, "e": ""}, {"id": 143, "t": "8. Reglamento alcantarillado", "r": "Art. 12", "q": "Los elementos de la instalación interior deben quedar…", "o": ["A cota superior a la tapa del pozo de registro más próximo", "Enterrados", "Al nivel del mar", "A cota inferior"], "c": 0, "e": "Si no, se instalan sistemas anti-retorno."}];
const $=s=>document.querySelector(s), app=$('#app');
const TEMAS=[...new Set(Q.map(q=>q.t))];
const AC=0.5, PEN=0.16;
let S=null;
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let fails=load('fails',[]), hist=load('hist',[]);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}

function home(){
  const last=hist.slice(-3).reverse();
  app.innerHTML=`<h1>Test de práctica</h1><div class="mu">Controlador/a medioambiental · EMAYA · ${Q.length} preguntas</div>
  <div class="card"><label for="mode">Modo</label>
  <select id="mode"><option value="exam">Simulacro de examen (puntúa +0,5 / –0,16)</option><option value="topic">Práctica por tema</option><option value="fails">Repasar mis falladas (${fails.length})</option></select>
  <div id="tw"><label for="topic">Tema</label><select id="topic"><option value="all">Todos los temas</option>${TEMAS.map(t=>`<option>${esc(t)}</option>`).join('')}</select></div>
  <label for="n">Número de preguntas</label>
  <select id="n"><option>10</option><option selected>20</option><option>40</option><option value="0">Todas las disponibles</option></select>
  <label class="chk"><input type="checkbox" id="imm"> Corrección inmediata tras cada respuesta</label>
  <button class="p" id="go" style="width:100%">Empezar</button></div>
  ${last.length?`<div class="card"><h2>Últimos intentos</h2>${last.map(h=>`<div class="mu">${esc(h.d)} · ${esc(h.m)} · ${h.ok}/${h.n} aciertos · ${h.p.toFixed(2).replace('.',',')} pts</div>`).join('')}</div>`:''}
  <p class="mu">Las respuestas en blanco ni suman ni restan. Tus falladas se guardan en este navegador.</p>`;
  const mode=$('#mode'),imm=$('#imm');
  const upd=()=>{$('#tw').style.display=mode.value==='topic'?'block':'none';imm.checked=mode.value!=='exam'};
  mode.onchange=upd;upd();
  $('#go').onclick=()=>start(mode.value,$('#topic').value,+$('#n').value,imm.checked);
}
function start(mode,topic,n,imm){
  let pool=Q;
  if(mode==='topic'&&topic!=='all')pool=Q.filter(q=>q.t===topic);
  if(mode==='fails'){pool=Q.filter(q=>fails.includes(q.id)); if(!pool.length){alert('Aún no tienes preguntas falladas.');return}}
  pool=shuffle(pool); if(n>0)pool=pool.slice(0,n);
  S={mode,imm,qs:pool,a:pool.map(()=>null),i:0,fin:false,label:mode==='exam'?'Simulacro':mode==='fails'?'Falladas':'Por tema'};
  show();
}
function show(){
  const q=S.qs[S.i],a=S.a[S.i],lock=S.imm&&a!==null;
  app.innerHTML=`<div class="mu">Pregunta ${S.i+1} de ${S.qs.length}</div><div class="bar"><i style="width:${(S.i+1)/S.qs.length*100}%"></i></div>
  <div class="card"><span class="tag">${esc(q.t)}</span><span class="tag">${esc(q.r)}</span><h2 style="margin-top:12px">${esc(q.q)}</h2>
  ${q.o.map((o,k)=>`<button class="opt ${cls(k,a,q,lock)}" data-k="${k}" ${lock?'disabled':''}><b>${'ABCD'[k]}</b><span>${esc(o)}</span></button>`).join('')}
  ${lock?`<div class="exp"><b>${a===q.c?'✔ Correcta.':'✘ Incorrecta. Era la '+'ABCD'[q.c]+'.'}</b> ${esc(q.e)}</div>`:''}</div>
  <div class="nav"><button id="pv" ${S.i===0?'disabled':''}>← Anterior</button>
  ${S.i<S.qs.length-1?'<button class="p" id="nx">Siguiente →</button>':'<button class="p" id="fn">Finalizar</button>'}</div>
  ${!S.imm&&a!==null?'<p class="mu">Toca de nuevo tu respuesta para dejarla en blanco.</p>':''}`;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k));
  $('#pv').onclick=()=>{S.i--;show()};
  if($('#nx'))$('#nx').onclick=()=>{S.i++;show()};
  if($('#fn'))$('#fn').onclick=finish;
  window.scrollTo(0,0);
}
function cls(k,a,q,lock){
  if(lock){if(k===q.c)return'ok';if(k===a)return'ko';return''}
  return a===k?'sel':''
}
function pick(k){
  if(S.imm){S.a[S.i]=k;} else {S.a[S.i]=(S.a[S.i]===k)?null:k;}
  show();
}
function finish(){
  const un=S.a.filter(x=>x===null).length;
  if(un&&!confirm(`Tienes ${un} pregunta(s) en blanco. ¿Finalizar igualmente?`))return;
  let ok=0,ko=0;
  S.qs.forEach((q,i)=>{const a=S.a[i]; if(a===null)return; if(a===q.c){ok++;fails=fails.filter(x=>x!==q.id)}else{ko++;if(!fails.includes(q.id))fails.push(q.id)}});
  const p=ok*AC-ko*PEN, max=S.qs.length*AC;
  save('fails',fails); hist.push({d:new Date().toLocaleDateString('es-ES'),m:S.label,ok,n:S.qs.length,p}); hist=hist.slice(-20); save('hist',hist);
  S.res={ok,ko,bl:S.qs.length-ok-ko,p,max}; S.fin=true; results('all');
}
function results(f){
  const r=S.res,n10=Math.max(0,r.p)/r.max*10,f2=x=>x.toFixed(2).replace('.',',');
  const items=S.qs.map((q,i)=>({q,a:S.a[i],i})).filter(x=>f==='all'||(f==='ko'&&x.a!==null&&x.a!==x.q.c));
  app.innerHTML=`<h1>Resultado</h1><div class="card"><p class="big">${f2(Math.max(0,r.p))} / ${f2(r.max)}</p>
  <div class="mu">Nota sobre 10: <b>${f2(n10)}</b></div>
  <p>✔ ${r.ok} aciertos · ✘ ${r.ko} errores · ○ ${r.bl} en blanco</p>
  <div class="mu">Puntuación = aciertos × 0,5 – errores × 0,16.</div>
  <div class="row" style="margin-top:12px"><button class="p" id="hm">Volver al inicio</button><button id="fl">${f==='ko'?'Ver todas':'Solo errores'}</button></div></div>
  <div class="card"><h2>Revisión</h2>${items.length?items.map(({q,a,i})=>`<div class="rv"><div class="s ${a===null?'bl':a===q.c?'ok':'ko'}">${i+1}. ${a===null?'○ En blanco':a===q.c?'✔ Correcta':'✘ Incorrecta'} <span class="tag">${esc(q.t)} · ${esc(q.r)}</span></div>
  <div>${esc(q.q)}</div><div class="mu">${a!==null&&a!==q.c?'Tu respuesta: '+'ABCD'[a]+') '+esc(q.o[a])+'<br>':''}Correcta: ${'ABCD'[q.c]}) ${esc(q.o[q.c])}</div>${q.e?`<div class="mu"><i>${esc(q.e)}</i></div>`:''}</div>`).join(''):'<p class="mu">No hay errores que mostrar.</p>'}</div>`;
  $('#hm').onclick=home; $('#fl').onclick=()=>results(f==='ko'?'all':'ko');
}
home();
</script></body></html>
